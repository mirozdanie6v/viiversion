      - new_market_or_audience
      - channel_strategy
      - positioning_audit

  sales_playbook:
    level: sales_execution
    title: "VIIVERSION Sales Playbook v1"
    drive_id: "1itFsDhoPZqyH1NN1emca9u1HFeqYouPu4gcuuzm9BL4"
