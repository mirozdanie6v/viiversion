github:
  website:
    repository: "mirozdanie6v/viiversion"
    production_branch: "viiversion"
    authority: L5_implementation_only
  proposal_studio:
    repository: "mirozdanie6v/viiversion-proposal-studio"
    role: owned_software_and_specialized_proposal_agent
  zl_web_agent:
    repository: "mirozdanie6v/zl-web-agent"
    role: working_agent_and_mcp_proof

refresh_policy:
  fast_reasoning:
    use_kernel: true
    live_refresh: minimal
  public_final:
    refresh_commercial_and_proof: true
    refresh_channel_rules: true
  implementation:
    refresh_decisions: true
    refresh_referenced_entities: true
    compare_against_current_code: true
  pricing_or_readiness:
    kernel_is_not_authoritative: true
    commercial_matrix_required: true
  market_or_distribution:
    refresh_global_brand: true
    refresh_channel_profile: true
    refresh_distribution_matrix: true
    current_pipeline_required_for_active_execution: true
  outreach_or_followup:
    sales_playbook_required: true
    sales_router_and_outreach_queue_required_for_live_action: true
  productization_or_launch:
    commercial_matrix_required: true
    launch_wave_and_distribution_pipeline_required: true
    proof_required_before_public_claim: true
  feedback:
    market_signals_required_for_recorded_learning: true
    no_automatic_canonical_change: true
  canonical_change:
    corporate_and_registry_required: true
    explicit_approval_required_before_write: true

conflict_policy:
  identity_or_ontology: corporate_wins
  current_commercial_fact: commercial_matrix_wins
  proof_maturity_or_claim: assets_wins
  global_marketing_rule: global_brand_wins
  channel_presentation: channel_source_wins_within_canon
  implementation_conflict: upstream_wins


live_app_dependency:
  app: google-drive
  connector_id: "plugin_connector_1p_ab21a553bfbc81919ea8fd1858e3ffa7"
  role: "user-authorized live Source of Truth reader"
  rule: >
    Google authorization stays in ChatGPT/Workspace. Brand MCP must not persist
    the user's Google credential. Use get_live_source_plan to choose minimal reads
    and validate_live_context before final/current claims.
