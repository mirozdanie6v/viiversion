    title: "VIIVERSION Commercial Matrix"
    drive_id: "14i9E4WGazfwwsGl2mP_0TtZa9URBI-zeKj-qromAl-4"
    tabs:
      Entity_Registry:
        owns: [canonical_entities, relationships, canonical_status]
      Products:
        owns: [sellability, readiness, price_hypotheses, commercial_treatment]
      Assets:
        owns: [proof_records, maturity, demo_urls, proof_strength, claim_limits]
      Offers:
        owns: [buyer_trigger_packaging, scoped_offers]
      Verticals:
        owns: [industry_packaging]
      Channel_Profiles:
        owns: [channel_rules]
      Projection_Index:
        owns: [approved_or_active_projections]
