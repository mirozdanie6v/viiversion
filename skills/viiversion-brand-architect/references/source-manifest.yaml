      Website_Decisions:
        owns: [website_decision_state]
      Homepage_Blocks:
        owns: [homepage_operational_block_state]
      UX_Rules:
        owns: [website_ux_operational_rules]
      Market_Signals:
        owns: [observations_and_validated_learning]
    refresh_when:
      - price
      - readiness
      - sellability
      - current_product_state
      - proof_selection
      - public_claim
      - current_decision
      - implementation

  global_brand:
