critical_guardrails:
  crm: "P10 means setup/integration of the client's chosen CRM; never claim a VIIVERSION proprietary CRM."
  geography: "Vietnam presence must not narrow the parent brand to a local Vietnamese developer."
  proof: "Always state maturity honestly."
  software: "Only promote owned software as finished public product when an external use/distribution path exists."
  canonical_change: "New repeated solution becomes candidate first; do not silently canonize it."
  technology: "Do not lead ordinary business buyers with stack/API/ETL before value and relevance."

