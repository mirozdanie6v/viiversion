core_principles:
  - "Buyer language over seller jargon."
  - "Proof before abstraction."
  - "A small entry product must be a complete useful result, not a teaser."
  - "Compose a larger system only when the buyer process requires it."
  - "Keep existing systems when integration is enough."
  - "AI is positioned inside a real process, not as decoration."
  - "Case and proof never become product identity."
  - "Verticals package reusable engineering; they do not create separate platforms."
  - "Channel presentation may adapt language but cannot rewrite canon."
  - "Market feedback moves upward as signal, not automatic canonical truth."

primary_audiences:
  SME_owner:
    need: "clear result, low-risk start, proof, understandable scope"
  operations_lead:
    need: "workflow, roles, statuses, handoffs, control"
  CTO_COO:
    need: "architecture, integration, data, reliability, implementation boundaries"
  partner:
    need: "delivery capacity, reusable modules, white-label/co-delivery, specialist engineering"
  software_user:
    need: "specific owned product, actual use path, maturity and product value"

