function art(p){if(p.source)return `<img src="${p.photos[0]}" alt="${esc(p.name)}" width="520" height="560" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'photo-fallback',textContent:'Фото временно недоступно'}))">`;if(productPhotos[p.id])return `<img src="${productPhotos[p.id]}" alt="${esc(p.name)}" width="520" height="560">`;let u='a'+(++uid),fill=`url(#${u}g)`,metal=`url(#${u}m)`;
const shape=p.pattern==='porcelain'?'M-35 -50 Q-13 -66 29 -47 L39 4 17 53 -37 35 -44 -9Z':p.pattern==='shell'?'M0 -58 Q-46 -59 -51 -10 Q-48 33 0 57 Q48 33 51 -10 Q46 -59 0 -58Z':p.pattern==='lighthouse'?'M-47 -49 Q0 -65 47 -49 L47 49 Q0 64 -47 49Z':'M-7 -57 C32 -60 48 -20 42 12 S15 59 -13 54 S-48 23 -43 -7 S-33 -51 -7 -57Z';
let deco='';
if(p.pattern==='wave')deco=`<path d="M-65 7 Q-30 -20 2 8 T65 2 V65 H-65Z" fill="${p.light}" opacity=".85"/><path d="M-65 5 Q-30 -21 2 7 T65 1" fill="none" stroke="#fffdf1" stroke-width="5" opacity=".9"/><path d="M-65 17 Q-30 -9 2 19 T65 13" fill="none" stroke="#f8f6ee" stroke-width="2" opacity=".65"/>`;
if(p.pattern==='porcelain')deco=Array.from({length:9},(_,i)=>`<g transform="translate(${(i%3-1)*30} ${(Math.floor(i/3)-1)*35})"><path d="M0 -13Q18 0 0 13Q-18 0 0 -13Z M-12 0H12M0-12V12" stroke="${p.color}" stroke-width="2" fill="none"/><circle r="3" fill="${p.color}"/></g>`).join('');
if(p.pattern==='sand'||p.pattern==='amber')deco=Array.from({length:32},(_,i)=>`<circle cx="${((i*37)%100)-50}" cy="${((i*29)%110)-55}" r="${1+i%3*.7}" fill="${i%2?'#fff3d9':'#815c37'}" opacity=".38"/>`).join('');
if(p.pattern==='glass')deco=`<path d="M-25 -41Q-42 0 -23 34" fill="none" stroke="#fff" stroke-width="5" opacity=".35"/><path d="M6 -48Q35 -22 27 10" fill="none" stroke="#fff" stroke-width="2" opacity=".25"/>`;
if(p.pattern==='shell')deco=Array.from({length:11},(_,i)=>`<path d="M0 54 Q${(i-5)*10} 0 ${(i-5)*10} -55" fill="none" stroke="#9e8c7d" stroke-width="1.7" opacity=".5"/>`).join('');
if(p.pattern==='lighthouse')deco=`<path d="M-50 34Q-25 18 0 34T50 34V60H-50Z" fill="#315e62"/><path d="M-12 32L-7 -26H7L12 32Z" fill="#fff3dc"/><path d="M-9 -9H9L10 4H-10Z" fill="#a34e3d"/><path d="M-14 -26H14L0 -39Z" fill="#a34e3d"/><rect x="-9" y="-25" width="18" height="10" fill="#e8b972"/>`;
function stone(x,y,scale,rot=0){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${scale})"><path d="${shape}" fill="${fill}" stroke="${metal}" stroke-width="2.8" filter="url(#${u}s)"/><g clip-path="url(#${u}c)">${deco}<ellipse cx="-15" cy="-22" rx="16" ry="25" fill="#fff" opacity=".09" transform="rotate(24)"/></g></g>`}
let item='';
if(p.shape==='pendant')item=`<path d="M43 -8 Q50 90 119 101Q188 90 197 -8" fill="none" stroke="${metal}" stroke-width="3" stroke-dasharray="4 2"/><ellipse cx="120" cy="103" rx="5" ry="10" fill="none" stroke="${metal}" stroke-width="3"/>${stone(120,165,1.02,-8)}`;
if(p.shape==='earrings')item=[[-1,83,126,-10],[1,155,151,10]].map(([_,x,y,r])=>`<path d="M${x-7} ${y-49}q-18 -27 1 -34q16 -5 13 15l-5 19" stroke="${metal}" stroke-width="3" fill="none"/>${stone(x,y,.69,r)}`).join('');
if(p.shape==='bracelet')item=`<ellipse cx="120" cy="140" rx="72" ry="49" fill="none" stroke="${metal}" stroke-width="4" stroke-dasharray="3 2"/>`+Array.from({length:9},(_,i)=>{let t=i*Math.PI*2/9;return stone(120+70*Math.cos(t),140+48*Math.sin(t),.29,i*36)}).join('');

return `<svg viewBox="0 0 240 268" role="img" aria-label="${p.name}" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${u}bg" x2="1" y2="1"><stop stop-color="#eee8dc"/><stop offset="1" stop-color="#c7c6b6"/></linearGradient><linearGradient id="${u}g" x2=".9" y2="1"><stop stop-color="${p.pattern==='porcelain'?p.light:p.color}"/><stop offset=".75" stop-color="${p.light}"/><stop offset="1" stop-color="${p.color}"/></linearGradient><linearGradient id="${u}m"><stop stop-color="#76522e"/><stop offset=".38" stop-color="#e4c489"/><stop offset=".7" stop-color="#a27943"/><stop offset="1" stop-color="#dec18d"/></linearGradient><filter id="${u}s" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#34382c" flood-opacity=".28"/></filter><clipPath id="${u}c"><path d="${shape}"/></clipPath></defs><rect width="240" height="268" fill="url(#${u}bg)"/><path d="M-10 198Q60 164 120 194T250 170V280H-10Z" fill="#f4eee2" opacity=".65"/><path d="M-10 218Q65 175 140 215T250 195" fill="none" stroke="#fffaf0" stroke-width="1.2" opacity=".6"/><ellipse cx="135" cy="217" rx="78" ry="15" fill="#696c5a" opacity=".08"/>${item}</svg>`}
function heart(id,cls='fav'){let yes=favs.includes(id);return `<button class="${cls}" data-fav="${id}" aria-label="${yes?'Убрать из избранного':'В избранное'}: ${get(id).name}" aria-pressed="${yes}">${yes?'♥':'♡'}</button>`}
function tile(p){return `<article class="tile"><div class="pic"><button class="picbutton" data-open="${p.id}" aria-label="Открыть ${p.name}">${art(p)}</button>${heart(p.id)}</div><div class="type">${p.category}</div><button class="name" data-open="${p.id}">${p.name}</button><div class="quick"><span class="price">${money(p.price)}</span><button class="add" data-add="${p.id}" aria-label="В корзину: ${p.name}">+</button></div></article>`}
const grid=items=>`<div class="grid">${items.map(tile).join('')}</div>`;

function home(){return hero()+`<div class="heading"><div><h2>Выберите своё</h2><small>Украшения на каждый день и особый случай</small></div></div><div class="categorytiles">${['Подвески','Серьги','Браслеты','Кольца','Броши'].map(c=>`<button data-homecat="${c}"><div class="pic">${art(products.find(p=>p.category===c))}</div><span>${c}</span></button>`).join('')}</div><section class="giftbanner"><div class="eyebrow">Для близких</div><h2>Подарок с характером</h2><p>Подберём украшения по случаю, стилю и бюджету.</p><button class="primary full" data-go="gifts">Подобрать подарок →</button></section>`+`<div class="heading"><div><h2>Островные истории</h2><small>Украшения с островным настроением</small></div><button class="link" data-go="catalog">Все</button></div>`+grid(products.slice(0,4))+`<section class="story"><div class="eyebrow">Вдохновение</div><h2>Частичка острова</h2><p>Сахалинская фабрика «Йети ФЭТИ» создаёт сувениры, вдохновлённые островами. Найдите украшение, которое напомнит о любимых местах или станет особенным подарком.</p><a href="https://www.yetifeti.ru/about" target="_blank" rel="noopener">О компании на официальном сайте ↗</a></section>`}
function filtered(){let items=products.filter(p=>(cat==='Все'||p.category===cat)&&`${p.name} ${p.category} ${p.materials}`.toLowerCase().includes(query.toLowerCase().trim()));if(sort==='low')items.sort((a,b)=>a.price-b.price);if(sort==='high')items.sort((a,b)=>b.price-a.price);return items}
function empty(title,body,label='В каталог',go='catalog'){return `<div class="empty"><h2>${title}</h2><p>${body}</p><button class="primary" data-go="${go}">${label}</button></div>`}
function results(){let items=filtered();document.getElementById('resultcount').textContent=`Найдено: ${items.length}`;document.getElementById('results').innerHTML=items.length?grid(items):`<div class="empty"><h2>Ничего не найдено</h2><p>Попробуйте другое название или снимите фильтры.</p><button class="secondary" data-reset>Сбросить фильтры</button></div>`}
function catalog(){return `<h1 style="font-size:39px">Коллекция</h1><p class="muted" style="margin:8px 0 16px">Найдите украшение для себя или в подарок.</p><input class="search" type="search" id="search" aria-label="Поиск украшений" placeholder="Найти украшение" value="${esc(query)}"><div class="chips" aria-label="Категории">${cats.map(c=>`<button class="chip ${cat===c?'active':''}" data-cat="${c}" aria-pressed="${cat===c}">${c}</button>`).join('')}</div><div class="filters"><small id="resultcount" aria-live="polite"></small><select id="sort" aria-label="Сортировка"><option value="default" ${sort==='default'?'selected':''}>По умолчанию</option><option value="low" ${sort==='low'?'selected':''}>Сначала дешевле</option><option value="high" ${sort==='high'?'selected':''}>Сначала дороже</option></select></div><div id="results"></div>`}
function detail(){let p=get(selected);if(!p)return empty('Изделие не найдено','Вернитесь в каталог.');return `<button class="back" data-back>← Назад</button><div class="split"><div class="pic detailpic">${art(p)}</div><div><div class="tag">${p.category}</div><div class="detailtitle"><h1>${p.name}</h1></div><div class="detailprice">${money(p.price)}</div><p>${p.story}</p><div class="actions"><button class="primary" data-add="${p.id}">В корзину</button>${heart(p.id,'heartbig')}</div><div class="spec"><strong>Материалы</strong><p>${p.materials}</p></div><div class="spec"><strong>Наличие и доставка</strong><p class="muted">Уточняйте наличие и условия доставки.</p></div>${p.source?`<div class="spec"><strong>Другие фотографии</strong><div class="realgallery">${p.photos.slice(1).map(u=>`<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="Дополнительное фото украшения" loading="lazy" referrerpolicy="no-referrer"></a>`).join('')}</div></div>`:''}</div></div>`}
function favorites(){let items=products.filter(p=>favs.includes(p.id));return `<h1 style="font-size:39px">Избранное</h1><p class="muted" style="margin:8px 0 18px">Сохраните то, что хочется носить или подарить.</p>`+(items.length?grid(items):empty('Пока пусто','Нажмите на сердечко рядом с украшением.'))}
function cartpage(){let items=Object.entries(cart).filter(([id,q])=>get(id)&&q>0),total=items.reduce((s,[id,q])=>s+get(id).price*q,0);return `<h1 style="font-size:39px">Корзина</h1><p class="muted" style="margin:8px 0 14px">Ваши выбранные изделия</p>`+(items.length?items.map(([id,q])=>{let p=get(id);return `<article class="cartrow"><button class="pic picbutton" data-open="${id}" aria-label="Открыть ${p.name}">${art(p)}</button><div><h3>${p.name}</h3><div class="price">${money(p.price*q)}</div><div class="qty"><button data-qty="${id}" data-delta="-1" aria-label="Уменьшить количество ${p.name}">−</button><span aria-label="Количество">${q}</span><button data-qty="${id}" data-delta="1" ${q>=9?'disabled':''} aria-label="Увеличить количество ${p.name}">+</button><button class="link" data-remove="${id}" aria-label="Удалить ${p.name}">Удалить</button></div></div></article>`}).join('')+`<div class="cartfoot"><div class="total"><span>Итого</span><span>${money(total)}</span></div><button class="primary full" data-checkout>Оформить заказ</button></div>`:empty('Корзина пока пуста','Выберите украшение из коллекции.'))}
function oldSuccess(){return `<section class="result"><div class="eyebrow">Ваш заказ</div><h1>Спасибо за выбор!</h1><p>${receipt?`${receipt.count} шт. · ${money(receipt.total)}`:''}</p><p>Ваш заказ подготовлен. Наличие украшений и условия получения уточняются перед покупкой.</p><button class="primary full" data-go="catalog">Продолжить выбор</button></section>`}
function render(focus=false){main.innerHTML=({home,catalog,detail,favorites,cart:cartpage,success,gifts,giftResults,profile,orders,addresses,settings,recent,about,contact,checkout,custom,customSaved}[page]||home)();if(page==='catalog')results();nav();if(focus){window.scrollTo(0,0);main.tabIndex=-1;main.focus({preventScroll:true})}}
function go(next,push=true){if(!['home','catalog','favorites','cart','detail','success','gifts','giftResults','profile','orders','addresses','settings','recent','about','contact','checkout','custom','customSaved'].includes(next))return;page=next;if(push){try{history.pushState({page,selected,returnPage},'','#'+next)}catch{}}render(true)}
function add(id,delta=1){if(!get(id))return;let n=(cart[id]||0)+delta;if(n>9){notice('Максимум 9 шт. одного изделия');return}if(n<=0)delete cart[id];else cart[id]=n;save();if(page==='cart')render();else nav();if(delta>0)notice('Добавлено в корзину')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.go){go(d.go)}else if(d.open){returnPage=page;selected=d.open;recentIds=[selected,...recentIds.filter(i=>i!==selected)].slice(0,15);persist('recent',recentIds);go('detail')}else if('back'in d){go(returnPage)}else if(d.fav){let id=d.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();if(page==='favorites'){render()}else{document.querySelectorAll(`[data-fav="${id}"]`).forEach(x=>{let yes=favs.includes(id);x.textContent=yes?'♥':'♡';x.setAttribute('aria-pressed',yes);x.setAttribute('aria-label',`${yes?'Убрать из избранного':'В избранное'}: ${get(id).name}`)})}notice(favs.includes(id)?'В избранном':'Удалено из избранного')}else if(d.add){add(d.add)}else if(d.cat){cat=d.cat;document.querySelectorAll('[data-cat]').forEach(x=>{x.classList.toggle('active',x.dataset.cat===cat);x.setAttribute('aria-pressed',x.dataset.cat===cat)});results()}else if('reset'in d){cat='Все';query='';sort='default';render()}else if(d.qty){add(d.qty,Number(d.delta))}else if(d.remove){delete cart[d.remove];save();render()}else if('checkout'in d&&Object.keys(cart).length){go('checkout')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;results()}});document.addEventListener('change',e=>{if(e.target.id==='sort'){sort=e.target.value;results()}});
window.addEventListener('popstate',e=>{let s=e.state||{page:'home'};selected=s.selected||null;returnPage=s.returnPage||'catalog';page=s.page==='success'&&!receipt?'cart':s.page;render(true)});

// Product Blueprint v2 / frontend revision 5. Local-only persistence, no outbound business writes.
Object.assign(icons,{gifts:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8C4 8 5 1 9 4l3 4c8 0 7-7 3-4l-3 4"/>',profile:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',orders:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M8 12h8M8 16h5"/>',addresses:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',settings:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/>',recent:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',contact:'<path d="M3 4h18v13H9l-6 4Z"/><path d="M7 9h10M7 12h7"/>'});
function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem('yf5-'+key))??fallback}catch{return fallback}}
function persist(key,value){try{localStorage.setItem('yf5-'+key,JSON.stringify(value))}catch{}}
let orderHistory=readLocal('orders',[]),recentIds=readLocal('recent',[]),customer=readLocal('customer',{name:'',phone:'',address:'',news:false}),customRequest=readLocal('custom',null);
if(!Array.isArray(orderHistory))orderHistory=[];if(!Array.isArray(recentIds))recentIds=[];if(!customer||typeof customer!=='object')customer={name:'',phone:'',address:'',news:false};
let gift={recipient:'Близкому человеку',occasion:'На память',style:'Любой',budget:'3000'},checkoutDraft={method:'Самовывоз',name:customer.name||'',phone:customer.phone||'',address:customer.address||'',comment:''};
const heading=(title,sub='')=>`<h1 style="font-size:39px">${title}</h1>${sub?`<p class="muted" style="margin:8px 0 18px">${sub}</p>`:''}`;
const backTo=(p)=>`<button class="back" data-go="${p}">← Назад</button>`;
const group=(key,label,opts)=>`<div class="giftstep">${label}</div><div class="giftoptions">${opts.map(([val,txt])=>`<button data-giftkey="${key}" data-giftval="${val}" class="${gift[key]===val?'active':''}" aria-pressed="${gift[key]===val}">${txt}</button>`).join('')}</div>`;
function gifts(){return heading('Подарки','Особенные вещи для особенных людей')+`<div class="giftbanner"><div class="eyebrow">Персональный подбор</div><h2>Найдём то самое</h2><p>Расскажите немного о человеке, которому выбираете подарок.</p></div><section class="section-card">${group('recipient','Кому выбираете?', ['Близкому человеку','Подруге','Коллеге','Себе'].map(x=>[x,x]))}${group('occasion','По какому поводу?', ['На память','День рождения','Благодарность','Без повода'].map(x=>[x,x]))}${group('style','Какой стиль ближе?', ['Любой','Лаконичный','Яркий','Морской'].map(x=>[x,x]))}${group('budget','Бюджет',[['1500','До 1 500 ₽'],['2000','До 2 000 ₽'],['3000','До 3 000 ₽'],['99999','Любой']])}<button class="primary full" data-go="giftResults">Подобрать подарок →</button></section><section class="story"><div class="eyebrow">Особый замысел</div><h2>Подарки на заказ</h2><p>Расскажите, какой подарок вы хотите подобрать для себя, близких или команды.</p><button class="secondary full" data-go="custom">Обсудить идею →</button></section>`}
function giftResults(){let match=products.filter(p=>p.price<=Number(gift.budget));let score=p=>{let n=0;if(gift.style==='Лаконичный'&&['SM01','SM02','04'].includes(p.id))n+=5;if(gift.style==='Яркий'&&['03','06','09','10'].includes(p.id))n+=5;if(gift.style==='Морской'&&['01','SM01','02','03','10'].includes(p.id))n+=5;if(gift.occasion==='На память'&&['01','06','09'].includes(p.id))n+=3;if(gift.occasion==='День рождения'&&['Серьги','Подвески'].includes(p.category))n+=2;if(gift.recipient==='Коллеге'&&p.price<=1500)n+=2;if(gift.recipient==='Подруге'&&p.category==='Серьги')n+=2;return n};match.sort((a,b)=>score(b)-score(a)||a.price-b.price);return backTo('gifts')+heading('Ваша подборка',`${gift.recipient} · ${gift.occasion} · ${gift.style==='Любой'?'Любой стиль':gift.style}`)+`<p class="muted" style="margin-bottom:15px">${gift.budget==='99999'?'Без ограничения бюджета':'До '+money(Number(gift.budget))} · ${match.length} изделий</p>`+(match.length?grid(match):empty('Пока ничего не нашли','Попробуйте изменить бюджет.','Изменить подбор','gifts'))}
const menu=(key,label,sub='')=>`<button class="menurow" data-go="${key}">${icon(icons[key]?key:'about')}<span><b>${label}</b>${sub?`<br><small>${sub}</small>`:''}</span><i>›</i></button>`;
function profile(){return `<div class="profiletop"><div class="avatar">${icon('profile')}</div><div><h1 style="font-size:33px">${customer.name?esc(customer.name):'Мой профиль'}</h1><small>Ваше пространство на Чердаке</small></div></div><div class="twocol"><button class="shortcut" data-go="orders">${icon('orders')}<strong>Мои заказы</strong><small>${orderHistory.length?orderHistory.length+' сохранено':'История покупок'}</small></button><button class="shortcut" data-go="favorites">${icon('favorites')}<strong>Избранное</strong><small>${favs.length?favs.length+' изделий':'Любимые изделия'}</small></button></div><section class="section-card">${menu('addresses','Контакты и адрес')}${menu('recent','Недавно просмотренные')}${menu('settings','Настройки')}${menu('contact','Связаться с магазином')}${menu('about','О фабрике и мастерах')}</section>`}
function orders(){return backTo('profile')+heading('Мои заказы','Ваши сохранённые заказы')+(orderHistory.length?orderHistory.map(o=>`<article class="ordercard"><div class="total" style="font-size:16px"><span>Заказ ${esc(o.number)}</span><span>${money(o.total)}</span></div><small>${esc(o.date)} · ${esc(o.method)}</small><p><strong>Сохранён</strong></p>${o.items.map(i=>`<div class="orderline"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<button class="secondary full" data-repeat="${esc(o.number)}" style="margin-top:12px">Повторить выбор</button></article>`).join(''):empty('Заказов пока нет','Выберите что-нибудь особенное.'))}
function field(name,label,value='',type='text',placeholder=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value||'')}" placeholder="${esc(placeholder)}"></div>`}
function addresses(){return backTo('profile')+heading('Контакты и адрес','Для удобства при следующем заказе')+`<form id="profileform" class="section-card">${field('name','Имя',customer.name,'text','Как к вам обращаться')}${field('phone','Телефон',customer.phone,'tel','+7')}${field('address','Адрес доставки',customer.address,'text','Город, улица, дом')}<button class="primary full" type="submit">Сохранить</button></form>`}
function settings(){return backTo('profile')+heading('Настройки')+`<section class="section-card"><div class="menurow"><span><b>Язык</b></span><small>Русский</small></div><div class="menurow"><span><b>Валюта</b></span><small>Рубли · ₽</small></div></section>`}
function recent(){let a=recentIds.map(get).filter(Boolean);return backTo('profile')+heading('Недавно просмотренные')+(a.length?grid(a):empty('Здесь пока пусто','Откройте изделия, которые вам интересны.'))}
function about(){return backTo('profile')+heading('О фабрике','ЙЕТИ ФЭТИ · Сувениры Чердака')+hero()+`<section class="story"><h2>Частичка острова</h2><p>Сахалинская фабрика авторских изделий. Вещи, вдохновлённые островной природой, морем и культурой.</p><a href="https://www.yetifeti.ru/about" target="_blank" rel="noopener">История фабрики ↗</a></section>`}
function contact(){return backTo('profile')+heading('Наш магазин','Сувениры Чердака · Южно-Сахалинск')+`<section class="section-card"><h2>Связаться с нами</h2><p style="margin:12px 0">Подскажем, как выбрать подарок и уточнить наличие.</p><a class="menurow" href="https://yetifeti.ru/" target="_blank" rel="noopener"><span>Официальный сайт</span>↗</a><a class="menurow" href="https://t.me/s/souvenirs_cherdaka" target="_blank" rel="noopener"><span>Каталог в Telegram</span>↗</a></section>`}
function checkout(){let total=Object.entries(cart).reduce((s,[id,q])=>s+get(id).price*q,0);if(!total)return empty('Корзина пуста','Добавьте изделия в корзину.');return backTo('cart')+heading('Оформление заказа','Выберите удобный способ получения')+`<form id="checkoutform" class="section-card checkout-form"><div class="field"><label for="method">Получение</label><select id="method" name="method">${['Самовывоз','Доставка по городу','Доставка по России'].map(m=>`<option ${m===checkoutDraft.method?'selected':''}>${m}</option>`).join('')}</select></div>${field('name','Имя',checkoutDraft.name,'text','Ваше имя')}${field('phone','Телефон',checkoutDraft.phone,'tel','+7')}<div id="addresswrap" ${checkoutDraft.method==='Самовывоз'?'hidden':''}>${field('address','Адрес доставки',checkoutDraft.address,'text','Город, улица, дом')}</div><div class="field"><label for="comment">Комментарий к заказу</label><textarea id="comment" name="comment" placeholder="Пожелания к заказу">${esc(checkoutDraft.comment)}</textarea></div><div class="total"><span>Товары</span><span>${money(total)}</span></div><p class="muted" style="margin:12px 0">Стоимость доставки и наличие уточняются перед оплатой.</p><button class="primary full" type="submit">Сохранить заказ</button></form>`}
function success(){return `<section class="result"><div class="eyebrow">Ваш заказ</div><h1>Спасибо за выбор!</h1><p>${receipt?`${receipt.count} шт. · ${money(receipt.total)}`:''}</p><p>Заказ сохранён в личном кабинете. Наличие и условия получения можно уточнить в магазине.</p><button class="primary full" data-go="orders">Мои заказы</button><button class="secondary full" data-go="catalog" style="margin-top:10px">Продолжить покупки</button></section>`}
function custom(){return backTo('gifts')+heading('Подарок на заказ','Расскажите о своей идее')+`<form id="customform" class="section-card"><div class="field"><label for="idea">Что вы хотите заказать?</label><textarea id="idea" name="idea" required placeholder="Например, подарки для команды">${esc(customRequest?.idea||'')}</textarea></div>${field('quantity','Количество',customRequest?.quantity||'','text','Например, 10')}${field('budget','Бюджет',customRequest?.budget||'','text','Ваш ориентир')}<button class="primary full" type="submit">Сохранить идею</button></form>`}
function customSaved(){return heading('Ваша идея сохранена')+`<section class="section-card"><p>${esc(customRequest?.idea||'')}</p><p class="muted" style="margin:12px 0">Обсудите детали с магазином, чтобы подобрать подходящий вариант.</p><button class="primary full" data-go="contact">Связаться с магазином</button><button class="secondary full" data-go="custom">Изменить идею</button></section>`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.homecat){cat=d.homecat;query='';sort='default';go('catalog')}else if(d.giftkey){gift[d.giftkey]=d.giftval;document.querySelectorAll(`[data-giftkey="${d.giftkey}"]`).forEach(x=>{let yes=x.dataset.giftval===d.giftval;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',yes)})}else if(d.repeat){let o=orderHistory.find(x=>x.number===d.repeat);if(o){o.items.forEach(i=>{if(get(i.id))cart[i.id]=Math.min(9,(cart[i.id]||0)+i.qty)});save();go('cart')}}});
document.addEventListener('input',e=>{if(e.target.closest('#checkoutform')&&e.target.name)checkoutDraft[e.target.name]=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='method'){checkoutDraft.method=e.target.value;document.getElementById('addresswrap').hidden=e.target.value==='Самовывоз'}});
document.addEventListener('submit',e=>{let f=e.target;if(!['profileform','checkoutform','customform'].includes(f.id))return;e.preventDefault();let val=Object.fromEntries(new FormData(f));if(f.id==='profileform'){customer={...customer,...val};persist('customer',customer);checkoutDraft={...checkoutDraft,name:customer.name,phone:customer.phone,address:customer.address};go('profile');notice('Данные сохранены')}else if(f.id==='customform'){customRequest=val;persist('custom',val);go('customSaved')}else{let items=Object.entries(cart).map(([id,qty])=>({id,qty,name:get(id).name,price:get(id).price}));if(!items.length)return;receipt={number:'Ч-'+Date.now().toString().slice(-8),date:new Date().toLocaleDateString('ru-RU'),items,count:items.reduce((a,i)=>a+i.qty,0),total:items.reduce((a,i)=>a+i.qty*i.price,0),method:val.method};orderHistory.unshift(receipt);persist('orders',orderHistory);cart={};save();go('success')}});

try{history.replaceState({page:'home'},'','#home')}catch{};render();
</script></body></html>
