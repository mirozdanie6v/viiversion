version: "1.0"
effective_date: "2026-09-24"

ownership:
  L1:
    owns:
      - company_identity
      - principal_directions
      - canonical_entity_names
      - canonical_definitions
      - entity_types
      - structural_relationships
  L2:
    owns:
      - lifecycle
      - sellability
      - readiness
      - offers
      - price_hypotheses
      - live_channel_fit
      - operational_status
  commercial_economics:
    sheet: Commercial_Economics
    owns:
      - delivery_effort
      - delivery_cost
      - support_cost
      - margin_signal
      - customization_level
      - repeatability
      - cac_assumptions
      - ltv_assumptions
      - economics_confidence
  revenue_intelligence:
    sheet: Revenue_Intelligence
    owns:
      - structured_sales_outcomes
      - objection_patterns
      - repeated_demand
      - price_reactions
      - proof_reactions
      - requested_capabilities
      - requested_integrations
      - buyer_language
      - revenue_learning_stage
  portfolio_intelligence:
    sheet: Portfolio_Intelligence
    owns:
      - cross_portfolio_priority
      - productization_candidates
      - overlap_and_merge_candidates
      - deprioritization_candidates
      - portfolio_blockers
      - portfolio_review_status
  proof_registry:
    sheet: Assets
    owns:
      - proof_maturity
      - verification
      - allowed_claims
  L3:
    owns:
      - global_positioning_rules
      - market_strategy
      - audience_strategy
      - messaging_principles
      - distribution_strategy
      - projection_rules
      - channel_profile_standards
  L4:
    owns:
      - display_name
      - headline
      - channel_description
      - cta
      - proof_selection
      - market_language_goal_adaptation
  L5:
    owns:
      - layout
      - code
      - publishing
      - deployment
      - platform_execution

decision_log:
  sheet: Decision_Log
  required_for:
    - principal_direction_change
    - upper_category_change
    - canonical_name_or_definition_change
    - strategic_parent_change
    - global_positioning_change
    - global_messaging_rule_change
    - global_distribution_rule_change
    - projection_precedence_change

market_signals:
  sheet: Market_Signals
  rule: "Signals may propose changes but never rewrite canon automatically."

closed_learning_loop:
  flow:
    - sales_and_market_observation
    - revenue_signal
    - economics_measurement
    - portfolio_interpretation
    - validated_learning
    - change_request
    - strategic_review
  rules:
    - "A single reply, objection or deal is evidence, not canonical truth."
    - "Revenue_Intelligence records sales learning; Market_Signals records broader market learning."
    - "Portfolio_Intelligence may recommend priority or productization but may not mutate canonical identity."
    - "Commercial_Economics may contain assumptions only when their confidence and evidence are explicit."
    - "Any L1-L3 mutation still requires Decision_Log and explicit approval."

new_entity_flow:
  - experiment
  - repeated_solution
  - pattern
  - candidate_entity
  - canonical_review
  - approved_entity
