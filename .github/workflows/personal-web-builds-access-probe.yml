name: Verify Cloudflare Builds permission for private Personal Web
on:
  push:
    branches: [main]
    paths: ['.github/workflows/personal-web-builds-access-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only verification of Workers Builds and GitHub integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          acc=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          tok=os.getenv('CLOUDFLARE_API_TOKEN','')
          if len(acc)!=32 or not tok:raise SystemExit('NO_AUTHORIZED_CLOUDFLARE_ACCESS')
          base='https://api.cloudflare.com/client/v4/accounts/'+acc
          def get(route):
            req=urllib.request.Request(base+route,headers={'Authorization':'Bearer '+tok,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=15) as res:code,data=res.status,res.read(130000)
            except urllib.error.HTTPError as err:code,data=err.code,err.read(5000)
            except Exception:return {'http':0}
            out={'http':code}
            if code==200:
              try:
                body=json.loads(data);res=body.get('result')
                out['success']=body.get('success')
                if isinstance(res,list):
                  out['result_count']=len(res)
                  if route=='/builds/repos/connections':
                    out['private_browser_repo_connected']=any(str(x.get('repo_id'))=='1427076050' for x in res)
                  if route=='/builds/tokens':out['has_build_tokens']=len(res)>0
                  if route=='/builds/triggers':
                    out['browser_builds_trigger_present']=any('personal-web' in str(x.get('trigger_name','')) for x in res)
                elif isinstance(res,dict):
                  out['result_keys']=sorted([k for k in res.keys() if k not in ('key','token','secret')])[:12]
              except Exception:out['json_parse_error']=True
            else:
              try:out['cloudflare_error_codes']=[x.get('code') for x in json.loads(data).get('errors',[])]
              except:pass
            return out
          output={route:get(route) for route in ['/builds/repos/connections','/builds/tokens','/builds/triggers','/workers/scripts/viiversion-personal-web-staging']}
          print(json.dumps(output,sort_keys=True))
          PY
