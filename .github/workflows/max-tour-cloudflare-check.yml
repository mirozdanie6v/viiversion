name: MAX TOUR Cloudflare credential check

on:
  push:
    branches:
      - max-tour-fullstack
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify required Cloudflare secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then echo 'CLOUDFLARE_API_TOKEN: missing'; exit 21; else echo 'CLOUDFLARE_API_TOKEN: configured'; fi
          if [ -z "${CF_ACCOUNT:-}" ]; then echo 'CLOUDFLARE_ACCOUNT_ID: missing'; exit 22; else echo 'CLOUDFLARE_ACCOUNT_ID: configured'; fi
