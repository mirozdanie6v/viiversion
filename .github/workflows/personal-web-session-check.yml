name: Personal Web owner session capability check
on:
  push:
    branches: [feat/personal-web-firecrawl-mvp]
    paths: [".github/workflows/personal-web-session-check.yml"]
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PERSONAL_WEB_API_TOKEN: ${{ secrets.PERSONAL_WEB_API_TOKEN }}
    steps:
      - name: Check whether account sessions exist (no content or tokens printed)
        run: |
          node --input-type=module <<'JS'
          const token=process.env.PERSONAL_WEB_API_TOKEN;
          if(!token || token.length<32){console.log(JSON.stringify({ownerTokenPresent:false}));process.exit(1)}
          const root='https://viiversion-personal-web-staging.viiversion.workers.dev';
          const response=await fetch(root+'/v1/session/list',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:'{}',signal:AbortSignal.timeout(20000)});
          if(!response.ok){console.log(JSON.stringify({http:response.status,sessionInspection:'unavailable'}));process.exit(1)}
          const data=await response.json();
          const origins=(Array.isArray(data.sessions)?data.sessions:[]).map(x=>x.origin||'').filter(x=>typeof x==='string');
          const hostname=x=>{try{return new URL(x).hostname}catch{return ''}};
          console.log(JSON.stringify({http:response.status,githubSessionPresent:origins.some(x=>hostname(x)==='github.com'),cloudflareSessionPresent:origins.some(x=>hostname(x)==='dash.cloudflare.com'),savedSessionCount:origins.length}));
          JS
