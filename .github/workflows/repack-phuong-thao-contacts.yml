          css=""".contact-page{position:relative;background:#07282d;color:#f7e6d0;overflow:hidden;text-align:center;padding:8% 5% 0;container-type:inline-size;margin:0 auto 12px;box-sizing:border-box;font-family:'Noto Sans','Noto Sans CJK SC','Noto Sans CJK KR',Arial,sans-serif}.contact-page *{box-sizing:border-box}.contact-brand{color:#dcb372;font:700 clamp(21px,4.1cqw,40px) Arial,sans-serif;letter-spacing:.25em}.contact-rule{width:26%;height:1px;border:0;background:#dcb372;margin:4% auto 5%}.contact-page h2{font-family:Georgia,'Noto Serif CJK SC','Noto Serif CJK KR',serif;font-size:clamp(30px,6.6cqw,65px);line-height:1.2;font-weight:400;margin:0 0 3%;color:#f7e6d0}.contact-page p{font-size:clamp(13px,2.7cqw,26px);color:#c1d0cf;margin:0 0 8%}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5%;padding:0 3% 5%;border-bottom:1px solid #dcb372}.contact-page a{color:inherit;text-decoration:none;overflow-wrap:anywhere}.contact-channel{display:flex;flex-direction:column;align-items:center;gap:10px}.contact-channel svg{width:100%;max-width:225px;height:auto;display:block;background:#fff}.contact-channel strong,.contact-person strong{font-size:clamp(14px,3cqw,29px);font-weight:700}.contact-channel small{font-size:clamp(10px,1.9cqw,18px);color:#c1d0cf}.contact-people{padding:5% 0 0;display:grid;gap:4cqw}.contact-person{display:grid;gap:10px}.contact-person a{font-size:clamp(14px,2.5cqw,25px);color:#c1d0cf}.contact-site{display:inline-block;font-size:clamp(20px,3.1cqw,31px);font-weight:700;margin:0 0 8%;color:#dcb372!important}.contact-seabed{height:14cqw;min-height:65px;background:url('contact-seabed.webp') center bottom/100% auto no-repeat;margin:0 -5.56%}.contact-page a:hover{text-decoration:underline}@media(max-width:480px){.contact-page{padding-top:12%}.contact-grid{gap:3%;padding:0 0 7%}.contact-channel{gap:6px}.contact-channel small{font-size:10px}.contact-person strong{font-size:18px}.contact-people{gap:22px;padding-top:8%}}"""
          pc="""@page{size:A4;margin:0}body{margin:0}.contact-page{width:210mm;height:297mm;padding:23mm 13mm 0;margin:0;container-type:normal}.contact-brand{font:700 27pt Arial,sans-serif;letter-spacing:.25em}.contact-rule{width:26%;margin:12mm auto 14mm}.contact-page h2{font-size:34pt;margin:0 0 8mm}.contact-page p{font-size:14pt;margin:0 0 16mm}.contact-grid{display:table;width:100%;table-layout:fixed;padding:0 0 11mm}.contact-channel{display:table-cell;width:33.33%;vertical-align:top;text-align:center;padding:0 3mm}.contact-channel svg{width:46mm;height:46mm;margin:0 auto 4mm}.contact-channel strong{display:block;font-size:16pt;margin:0 0 2mm}.contact-channel small{display:block;font-size:10pt}.contact-people{display:block;padding:11mm 0 0}.contact-person{display:block;margin-bottom:9mm}.contact-person strong{display:block;font-size:18pt;margin-bottom:3mm}.contact-person a{display:block;font-size:13pt}.contact-people+.contact-rule{margin:6mm auto 8mm}.contact-site{font-size:19pt;margin:0}.contact-seabed{position:absolute;bottom:0;left:0;right:0;height:23mm;min-height:0;margin:0}"""
          def markup(l):
              a,b,c,_=translations[l]
              result=original.replace('>Contact us<','>'+a+'<').replace('>Scan a QR code to get in touch<','>'+b+'<').replace('>Scan to connect<','>'+c+'<').replace('aria-label="VIIVERSION contacts"','aria-label="VIIVERSION · '+html.escape(a)+'"')
              assert re.findall(r'href="([^"]+)"',result)==urls
              return result
          def doc(l,body,styles):
              return '<!doctype html><html lang="'+l+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VIIVERSION · Contacts</title><style>'+styles+'</style></head><body>'+body+'</body></html>'
          def uri_set(page):
              return {str(a.get_object().get('/A',{}).get('/URI','')) for a in page.get('/Annots',[]) if a.get_object().get('/Subtype')=='/Link'}
          def contact_bytes(l):
              data=HTML(string=doc(l,markup(l),css+pc),base_url=str(out)+'/').write_pdf()
              pdf=PdfReader(io.BytesIO(data))
              assert len(pdf.pages)==1,(l,len(pdf.pages))
              assert set(urls)<=uri_set(pdf.pages[0]),(l,uri_set(pdf.pages[0]))
              assert 'VIIVERSION' in re.sub(r'\s+','',pdf.pages[0].extract_text() or ''),(l,pdf.pages[0].extract_text())
              return data
          names={'vi':'Menu-VI.pdf','en':'Menu-VI-EN.pdf','ru':'Menu-VI-RU.pdf','zh':'Menu-VI-ZH.pdf','ko':'Menu-VI-KO.pdf'}
          def append(path, data, count):
              source=PdfReader(path)
              assert len(source.pages) in [count,count+1],(path,len(source.pages))
              writer=PdfWriter()
              for p in source.pages[:count]:writer.add_page(p)
              writer.append(PdfReader(io.BytesIO(data)))
              tmp=path.with_suffix('.tmp')
              writer.write(tmp)
              result=PdfReader(tmp)
              assert len(result.pages)==count+1
              assert set(urls)<=uri_set(result.pages[-1]),(path,uri_set(result.pages[-1]))
              # Original menu content unchanged; contact page is last and same A4 size.
              for i,p in enumerate(source.pages[:count]):assert p.extract_text()==result.pages[i].extract_text()
              assert all(abs(float(p.mediabox.width)-595.28)<1 and abs(float(p.mediabox.height)-841.89)<1 for p in result.pages)
              tmp.replace(path)
          for l,name in names.items():
              data=contact_bytes(l)
              append(out/name,data,4)
              (out/('Contacts-'+l.upper()+'.pdf')).write_bytes(data)
          shutil.copyfile(out/'Menu-VI-RU.pdf',out/'Phuong-Thao-illustrated-menu.pdf')
          append(out/'Proposal-RU.pdf',contact_bytes('ru'),1)
          (out/'contacts.html').write_text(doc('ru',markup('ru'),css+'body{background:#07282d;max-width:760px;margin:auto}'))
          rendered=pdfium.PdfDocument(str(out/'Menu-VI-RU.pdf'))
          for i in range(5):
              rendered[i].render(scale=150/72).to_pil().save(out/('contact-page.png' if i==4 else f'menu-{i+1:02}.png'))
          rendered.close()
          imgs=[Image.open(out/f'menu-{i:02}.png').convert('RGB') for i in range(1,5)]
          imgs.append(Image.open(out/'contact-page.png').convert('RGB'))
          w=360;h=round(w*imgs[0].height/imgs[0].width)
          preview=Image.new('RGB',(3*w+80,2*h+60),(246,235,214))
          for i,im in enumerate(imgs):
              preview.paste(im.resize((w,h),Image.Resampling.LANCZOS),(20+i%3*(w+20),20+i//3*(h+20)))
          preview.save(out/'preview.jpg',quality=92)
          # Reuse exactly the same approved contact section in the localized browser menu.
          path=out/'index.html'
          s=path.read_text()
          assert 'translation-v4' in s or 'contacts-v5' in s
          assert 'id="contacts"' not in s
          s=s.replace('translation-v4','contacts-v5').replace('</head>','<style>'+css+'</style></head>',1)
          s=s.replace('</main>',markup('vi')+'</main>',1)
          for l in names:
              pattern=r'(<template id="tpl-'+l+r'">)(.*?)(</template>)'
              s,n=re.subn(pattern,lambda m:m[1]+m[2]+markup(l)+m[3],s,count=1,flags=re.S)
              assert n==1,l
          # Jump to the last page on any language.
          s=s.replace('<footer class="demo-links">','<footer class="demo-links"><a id="contacts-link" href="#contacts">Liên hệ</a>',1)
          s=s.replace('const labels=', 'const contactLabels='+json.dumps({l:translations[l][3] for l in names},ensure_ascii=False)+';const labels=',1)
          s=s.replace("document.querySelector('#proposal').textContent=labels[l].proposal;","document.querySelector('#proposal').textContent=labels[l].proposal;document.querySelector('#contacts-link').textContent=contactLabels[l];",1)
          path.write_text(s)
          # Repack the proposal landing page without mixing company contacts into Google Maps uploads.
          p=out/'materials.html';s=p.read_text().replace('translation-v4','contacts-v5')
          s=s.replace('<p>VIIVERSION · <a href="https://viiversion.com/">viiversion.com</a></p>', '<section><h2>Контактная страница VIIVERSION</h2><p>Последняя страница всех PDF и электронного меню. <a href="Contacts-RU.pdf">PDF</a> · <a href="contact-page.png">PNG</a> · <a href="contacts.html">Открыть отдельно</a>.</p></section>'+markup('ru'),1)
          assert 'id="contacts"' in s
          s=s.replace('</head>','<style>'+css+'</style></head>',1)
          p.write_text(s)
          # Check browser behavior: all five languages, 24 photos, and exactly six working contact link targets in the final section.
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('google-chrome-stable')
          if not chrome:subprocess.run(['python3','-m','playwright','install','chromium'],check=True)
          with sync_playwright() as p:
              b=p.chromium.launch(executable_path=chrome or None,headless=True,args=['--no-sandbox'])
              page=b.new_page(viewport={'width':390,'height':844})
              page.goto((out/'index.html').as_uri(),wait_until='load')
              for l in names:
                  page.locator(f'button[data-lang="{l}"]').click()
                  assert page.locator('main > section').count()==5
                  assert page.locator('main > section').last.get_attribute('id')=='contacts'
                  assert page.locator('main .dish-photo').count()==24
                  assert page.locator('main #contacts a').evaluate_all('nodes => nodes.map(n=>n.getAttribute("href"))')==urls
                  assert page.locator('main #contacts svg').count()==3
                  assert page.locator('main #contacts h2').inner_text()==translations[l][0]
                  assert page.evaluate('document.documentElement.scrollWidth <= innerWidth'),l
              page.locator('button[data-lang="ru"]').click()
              page.locator('main #contacts').screenshot(path=str(out/'contact-mobile.png'))
              b.close()
          print('PASS: six identical Coral contact URLs; three QR codes; five locale variants; five menu PDFs with five pages each; proposal two pages; original four pages unchanged.')
          PY
