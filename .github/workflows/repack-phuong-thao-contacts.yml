name: Repack Phuong Thao with approved VIIVERSION contacts
on:
  push:
    branches: [viiversion]
    paths: ['.github/workflows/repack-phuong-thao-contacts.yml']
permissions:
  contents: write
jobs:
  contact-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: viiversion
      - name: Prepare rendering and verification
        run: |
          python3 -m pip install --quiet weasyprint pypdf pypdfium2 pillow playwright
          if ! fc-list :lang=zh | grep -q . || ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Append approved contact page to every edition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,base64,html,shutil,subprocess,io
          from pathlib import Path
          from weasyprint import HTML
          from pypdf import PdfReader,PdfWriter
          import pypdfium2 as pdfium
          from PIL import Image
          from playwright.sync_api import sync_playwright
          out=Path('site_assets/demo/phuong-thao-v2').resolve()
          assert (out/'translations.json').is_file(), 'Reviewed translation build required'
          urls=json.loads(r'''["https://t.me/Flyer_Flyer","https://zaloapp.com/qr/p/9d67yyky8rql?src=qr","https://wa.me/qr/T5NC246H6ON6O1","mailto:dmitrii.vladimirov@viiversion.com","mailto:olga.nogtich@viiversion.com","https://viiversion.com/"]''')
