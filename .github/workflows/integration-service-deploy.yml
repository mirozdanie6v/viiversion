name: Integration Service Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integration-service/.deploy'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integration-service
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy
      - name: Smoke test
        run: curl -fsS https://integration.viiversion.com/health
