name: Import Phuong Thao v2 assets
on:
  push:
    branches: [viiversion]
    paths: ['.github/workflows/import-phuong-thao-v2.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: viiversion
      - name: Download and verify the prepared assets
        shell: bash
        run: |
          set -euo pipefail
          url=$(curl -fsS -X POST 'https://api.firestorage.ai/dev/file/shares/O771NFfCiVt5/files/01a212df78ea7718a8a2c501e35076d5/download' -H 'Content-Type: application/json' -d '{}' | jq -er '.downloadUrl')
          curl -fsSL "$url" -o /tmp/phuong-thao.zip
          echo 'ad610b66a5d3b761f00482e7132eae122931ddbc39e4612b0b779118e8f17210  /tmp/phuong-thao.zip' | sha256sum -c -
          python3 -m pip install --quiet qrcode
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, json, qrcode, qrcode.image.svg
          out=Path('site_assets/demo/phuong-thao-v2')
          out.mkdir(parents=True,exist_ok=True)
          files=['index.html','Menu-VI-EN.pdf','Menu-VI-RU.pdf','Proposal-VI.pdf','logo-concept.png','logo-concept.svg','menu-01.png','menu-02.png','menu-03.png','menu-04.png','preview.jpg','mobile-preview.png']
          with zipfile.ZipFile('/tmp/phuong-thao.zip') as z:
              for name in files:
                  (out/name).write_bytes(z.read(name))
          qrcode.make('https://viiversion.com/demo/phuong-thao/',image_factory=qrcode.image.svg.SvgPathImage,box_size=10,border=4).save(out/'qr-menu.svg')
          menu=out/'index.html'
          s=menu.read_text()
          assert 'noindex,nofollow' in s
          s=s.replace('</body>','<footer style="text-align:center;padding:12px 16px 28px;font:14px Arial,sans-serif"><a href="materials.html" style="color:#244D42">VIIVERSION · Design proposal / Hồ sơ thiết kế</a></footer></body>')
          menu.write_text(s)
          (out/'materials.html').write_text("""<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Phương Thảo — Design proposal | VIIVERSION</title><style>*{box-sizing:border-box}body{margin:0;background:#f6ebd6;color:#302820;font:16px/1.55 Arial,sans-serif}main{max-width:800px;margin:auto;padding:24px}h1,h2{color:#244d42;font-family:Georgia,serif}a{color:#244d42}img{width:100%;display:block}figure{margin:0}section{padding:20px 0;border-bottom:1px solid #d3a34d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.qr{width:180px;max-width:100%;background:white;padding:8px}.eyebrow{color:#b4452b;letter-spacing:.15em;font-size:12px;font-weight:bold}@media(max-width:500px){main{padding:15px}.grid{grid-template-columns:1fr}}</style></head><body><main><p class="eyebrow">VIIVERSION · NHA TRANG</p><h1>Phương Thảo · Костя</h1><p>Đề xuất thiết kế dành riêng cho quán. Mẫu minh họa; món ăn, giá và hình ảnh cần được quán xác nhận.</p><p><a href="./">Xem thực đơn điện tử · Digital menu</a> · <a href="Proposal-VI.pdf">Đề xuất dịch vụ (PDF)</a></p><section><h2>Thiết kế thực đơn</h2><div class="grid"><a href="menu-01.png"><img src="menu-01.png" alt="Bìa thực đơn"></a><a href="menu-02.png"><img src="menu-02.png" alt="Hải sản"></a><a href="menu-03.png"><img src="menu-03.png" alt="Món nóng"></a><a href="menu-04.png"><img src="menu-04.png" alt="Đồ uống"></a></div><p><a href="Menu-VI-RU.pdf">PDF Việt–Nga</a> · <a href="Menu-VI-EN.pdf">PDF Việt–Anh</a></p></section><section><h2>Google Maps</h2><p>Đề xuất ảnh thực đơn và nhận diện; ảnh thực tế và dữ liệu quán cần được xác nhận trước khi cập nhật.</p><a href="logo-concept.png"><img src="logo-concept.png" alt="Đề xuất logo" style="max-width:220px"></a><p><a href="logo-concept.svg">Logo SVG</a> · <a href="preview.jpg">Bản xem tổng thể</a> · <a href="mobile-preview.png">Giao diện điện thoại</a></p></section><section><h2>Mã QR thực đơn</h2><a href="qr-menu.svg"><img class="qr" src="qr-menu.svg" alt="QR thực đơn"></a><p><a href="qr-menu.svg" download>Tải mã QR</a></p></section><p>VIIVERSION · <a href="https://viiversion.com/">viiversion.com</a></p></main></body></html>""")
          p=Path('package.json')
          cfg=json.loads(p.read_text())
          suffix=' && mkdir -p public/demo/phuong-thao && cp site_assets/demo/phuong-thao.html public/demo/phuong-thao/index.html'
          assert suffix in cfg['scripts']['build']
          cfg['scripts']['build']=cfg['scripts']['build'].replace(suffix,' && mkdir -p public/demo/phuong-thao && cp -a site_assets/demo/phuong-thao-v2/. public/demo/phuong-thao/')
          p.write_text(json.dumps(cfg,indent=2)+'\n')
          PY
      - name: Commit only the isolated demo
        shell: bash
        run: |
          git config user.name "VIIVERSION deployment"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_assets/demo/phuong-thao-v2 package.json
          git commit -m "Publish Phuong Thao v2 menu and proposal materials"
          git push origin HEAD:viiversion
