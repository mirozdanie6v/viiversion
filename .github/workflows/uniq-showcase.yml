name: UNIQ showcase proof and QA
on:
  push:
    branches: [viiversion]
    paths:
      - '.github/workflows/uniq-showcase.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: viiversion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright sharp
      - run: npx playwright install --with-deps chromium
      - name: Capture real public app with synthetic demo records
        run: node scripts/capture-uniq-showcase.cjs
      - name: Build and validate both case pages
        run: |
          python3 -m py_compile scripts/uniq_case.py
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Case(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.h1=0;self.proofs=[];self.ids=set()
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1':self.h1+=1
                  if a.get('id'):self.ids.add(a['id'])
                  if tag=='img' and a.get('src','').startswith('/assets/cases/uniq-'):
                      self.proofs.append(a['src'])
          for prefix in ('','en/'):
              p=Case();p.feed(Path('public/'+prefix+'cases/uniq-smart-rent/index.html').read_text())
              assert p.h1==1
              assert {'customer','employee','owner','engineering','adaptation'}<=p.ids
              assert len(p.proofs)>=16, p.proofs
              assert all(Path('public'+img).is_file() for img in p.proofs)
          PY
      - name: Commit verified real screenshots
        run: |
          git config user.name "viiversion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site_assets/cases/uniq-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified UNIQ workflow screenshots"
          git push origin HEAD:viiversion
