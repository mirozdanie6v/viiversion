name: Dev Cloud MVP tests
on:
  push:
    branches:
      - feat/dev-cloud-codex-linux
    paths:
      - 'dev-cloud/**'
      - '.github/workflows/dev-cloud-ci.yml'
  pull_request:
    paths:
      - 'dev-cloud/**'
      - '.github/workflows/dev-cloud-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile
        run: python3 -m py_compile dev-cloud/viidev.py dev-cloud/tests/test_viidev.py
      - name: Offline unit tests
        run: python3 -m unittest discover -s dev-cloud/tests -v
      - name: Ubuntu bootstrap shell syntax
        run: bash -n dev-cloud/deploy/*.sh
      - name: Validate user service unit
        run: systemd-analyze verify dev-cloud/deploy/viiversion-dev-cloud.service
