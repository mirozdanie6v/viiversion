name: Personal Web CI

on:
  pull_request:
    paths:
      - "personal-web/**"
      - ".github/workflows/personal-web-ci.yml"
  push:
    branches:
      - "feat/personal-web-firecrawl-mvp"
    paths:
      - "personal-web/**"
      - ".github/workflows/personal-web-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: personal-web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
