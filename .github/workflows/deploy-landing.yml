name: Deploy VIIVERSION landing

on:
  push:
    branches:
      - viiversion
    paths:
      - "scripts/**"
      - "src/**"
      - "site_assets/**"
      - "package.json"
      - "wrangler.jsonc"
      - "site.xz.b64.*"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viiversion-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: f4935962036fd500d34335e0b174b227
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare token
        run: test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Verify requested hero copy in build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Разработка кастомных ИТ-систем, мобильных приложений и сквозных интеграций." public/index.html
          grep -Fq "Связываем ваши сайты, облачные сервисы, CRM и мессенджеры в единый автоматизированный контур. Строим модульную архитектуру, которая позволяет внедрять решения поэтапно и масштабировать бизнес без остановки текущих операций." public/index.html

      - name: Deploy landing Worker
        run: npx wrangler deploy

      - name: Verify live hero
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "https://viiversion.com/?hero-deploy=${GITHUB_SHA}-${i}" -o "$tmp"; then
              if grep -Fq "Разработка кастомных ИТ-систем, мобильных приложений и сквозных интеграций." "$tmp" &&
                 grep -Fq "Связываем ваши сайты, облачные сервисы, CRM и мессенджеры в единый автоматизированный контур. Строим модульную архитектуру, которая позволяет внедрять решения поэтапно и масштабировать бизнес без остановки текущих операций." "$tmp"; then
                echo "Live hero verified"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "::error::New hero copy is not visible on viiversion.com"
          exit 1
