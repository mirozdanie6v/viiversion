name: Capture case screenshots

on:
  push:
    branches: [viiversion]
    paths:
      - ".github/workflows/capture-case-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: viiversion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and image tools
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
      - name: Capture real public demos
        run: |
          cat > capture-cases.cjs <<'JS'
          const { chromium } = require('playwright');
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const cases = {
            'max-tour': 'https://max-tour.viiversion.com/',
            'uniq-smart-rent': 'https://uniq-smart-rent.mirozdanie6v.workers.dev/',
            'pet-nika': 'https://pet-nika.viiversion.com/',
            'ave-dental': 'https://ave-dental-miniapp.vercel.app/',
            'true-surf': 'https://truesurf-app.viiversion.com/',
            'rusinfocenter': 'https://rusinfocenter.viiversion.com/',
            'g-beauty': 'https://gbeauty-vien-trieu-prototype.mirozdanie6v.workers.dev/'
          };

          (async()=>{
            const outDir='site_assets/cases';
            fs.mkdirSync(outDir,{recursive:true});
            const browser=await chromium.launch({headless:true});
            for(const [slug,url] of Object.entries(cases)){
              const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
              try{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(2500);
                const png=await page.screenshot({type:'png',fullPage:false});
                await sharp(png).resize(1200,750,{fit:'cover',position:'top'}).webp({quality:84}).toFile(path.join(outDir,slug+'.webp'));
                console.log('captured',slug,url);
              }catch(e){
                console.error('capture failed',slug,url,e.message);
              }finally{
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node capture-cases.cjs
      - name: Commit screenshots
        run: |
          git config user.name "viiversion-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site_assets/cases/*.webp || true
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "Refresh real case screenshots"
          git push origin HEAD:viiversion
