name: MAX TOUR Backend CI

on:
  push:
    branches:
      - backend-max-tour
  pull_request:
    branches:
      - backend-max-tour

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: Verify D1 core and MAX TOUR tables
        run: >-
          npx wrangler d1 execute DB --local --command
          "SELECT
          (SELECT COUNT(*) FROM users) +
          (SELECT COUNT(*) FROM admins) +
          (SELECT COUNT(*) FROM auth_sessions) +
          (SELECT COUNT(*) FROM audit_log) +
          (SELECT COUNT(*) FROM app_settings) +
          (SELECT COUNT(*) FROM demo_sessions) +
          (SELECT COUNT(*) FROM destinations) +
          (SELECT COUNT(*) FROM demo_destinations) +
          (SELECT COUNT(*) FROM tours) +
          (SELECT COUNT(*) FROM tour_images) +
          (SELECT COUNT(*) FROM demo_tour_overrides) +
          (SELECT COUNT(*) FROM demo_user_created_tours) +
          (SELECT COUNT(*) FROM demo_availability) +
          (SELECT COUNT(*) FROM demo_promotions) +
          (SELECT COUNT(*) FROM orders) +
          (SELECT COUNT(*) FROM order_participants) +
          (SELECT COUNT(*) FROM payments) +
          (SELECT COUNT(*) FROM analytics_events) +
          (SELECT COUNT(*) FROM manager_status_history) AS total_rows;"

      - name: Validate Worker build
        run: npx wrangler deploy --dry-run --outdir dist
