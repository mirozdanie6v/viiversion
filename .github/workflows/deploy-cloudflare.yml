name: Deploy landing to Cloudflare

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viiversion-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore static site
        shell: bash
        run: |
          set -euo pipefail
          cat site.xz.b64.* | base64 -d > site.tar.xz
          xz -dc site.tar.xz > site.tar
          rm -rf public
          mkdir public
          tar -xf site.tar -C public
          test -f public/index.html
          test -f public/prototypes.html
          test -f public/cases/ave-clinic.html
          test -f public/cases/pet-nika.html
          test -f public/cases/true-surf.html
          test -f public/cases/gbeauty.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare credentials are not configured for this GitHub repository. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as Actions secrets."
            exit 1
          fi

      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
