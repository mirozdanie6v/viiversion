name: Probe Bókun booking contract

on:
  push:
    branches: [main]
    paths:
      - '.probe-bokun-contract'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Query read-only checkout options
        shell: bash
        run: |
          set -euo pipefail
          base='https://integration.viiversion.com/api/bokun/booking-contract-probe?vendorId=137689&productId='
          curl -fsS --max-time 120 "${base}1287578" > /tmp/p1.json
          curl -fsS --max-time 120 "${base}1287580" > /tmp/p2.json
          jq -n --slurpfile p1 /tmp/p1.json --slurpfile p2 /tmp/p2.json '{
            auditedAt:(now|todate),
            products:[$p1[0],$p2[0]]
          }' > .bokun-contract-probe.json
          jq '{
            auditedAt,
            products:[.products[]|{
              productId,
              readOnly,
              createsBooking,
              oauth:.oauth.installation|{vendorId,oauthConnected,restCredentialsReady,domain,scopes},
              sample,
              endpoint,
              probes
            }]
          }' .bokun-contract-probe.json
      - name: Save probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bokun-contract-probe.json
          git commit -m "Record read-only Bókun contract probe" || true
          git push origin HEAD:main
