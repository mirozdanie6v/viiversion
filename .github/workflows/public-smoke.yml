name: Public smoke check

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

concurrency:
  group: viiversion-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public industry-first commercial site
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://landing.viiversion.workers.dev"
          CUSTOM="https://viiversion.com"
          PET="https://pet-nika.viiversion.com/"
          UNIQ="https://uniq-smart-rent.mirozdanie6v.workers.dev/"

          fetch_page() {
            local url="$1"; local out="$2"; local code=""
            for _ in $(seq 1 30); do
              code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 25 --output "$out" --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]] && [[ -s "$out" ]]; then echo "OK $url HTTP 200"; return 0; fi
              sleep 6
            done
            echo "FAIL $url HTTP ${code:-none}" >&2; return 1
          }
          require_text(){ grep -Fq "$2" "$1" || { echo "FAIL missing $3" >&2; return 1; }; echo "OK $3"; }
          reject_text(){ if grep -Fq "$2" "$1"; then echo "FAIL unexpected $3" >&2; return 1; fi; echo "OK absent $3"; }

          main="$(mktemp)"; custom="$(mktemp)"; module="$(mktemp)"; modules="$(mktemp)"; cases="$(mktemp)"
          en="$(mktemp)"; js="$(mktemp)"; photo1="$(mktemp)"; photo2="$(mktemp)"; pet="$(mktemp)"; uniq="$(mktemp)"

          fetch_page "$BASE/" "$main"
          fetch_page "$CUSTOM/" "$custom"
          fetch_page "$CUSTOM/modules/" "$modules"
          fetch_page "$CUSTOM/modules/online-booking/" "$module"
          fetch_page "$CUSTOM/cases/" "$cases"
          fetch_page "$CUSTOM/en/" "$en"
          fetch_page "$CUSTOM/assets/viiversion.js" "$js"
          fetch_page "$CUSTOM/assets/team/dmitrii.webp" "$photo1"
          fetch_page "$CUSTOM/assets/team/olga.webp" "$photo2"

          require_text "$main" "Цифровые решения для конкретных задач бизнеса" "concrete hero"
          require_text "$main" "Что можно купить для вашего бизнеса" "industry browser"
          require_text "$main" 'data-industry-tab="hotels"' "hotel tab"
          require_text "$main" 'data-industry-tab="shops"' "retail tab"
          require_text "$main" "Вы общаетесь напрямую с теми, кто делает продукт" "trust block"
          require_text "$main" "Пять понятных шагов до первого результата" "safe buying steps"
          require_text "$modules" "Что можно купить" "module catalogue"
          require_text "$module" "Что мы не будем делать без согласования" "module safety"
          require_text "$module" "8–18M ₫" "module price"
          require_text "$cases" "ИНТЕРАКТИВНОЕ ДЕМО" "honest proof status"
          require_text "$js" "data-industry" "industry interaction source" || true
          require_text "$js" "landingPage" "first-touch attribution"
          require_text "$en" "Digital systems for sales and operations" "English version"
          reject_text "$main" "коммерческих ядер" "internal marketing jargon"

          fetch_page "$PET" "$pet"
          fetch_page "$UNIQ" "$uniq"
          require_text "$pet" "PET NIKA" "PET live"
          require_text "$uniq" "UNIQ" "UNIQ live"

          rm -f "$main" "$custom" "$module" "$modules" "$cases" "$en" "$js" "$photo1" "$photo2" "$pet" "$uniq"
          echo "PUBLIC INDUSTRY-FIRST QA PASS"
