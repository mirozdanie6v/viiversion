name: Public smoke check

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

concurrency:
  group: viiversion-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check VIIVERSION public product architecture and proof routes
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://landing.viiversion.workers.dev"
          CUSTOM="https://viiversion.com"
          PET="https://pet-nika.viiversion.com/"
          PET_BROKEN="https://pet-nika.viiversion.com/miniapp"
          UNIQ="https://uniq-smart-rent.mirozdanie6v.workers.dev/"
          RIC="https://rusinfocenter.viiversion.com/"
          RIC_BOT="https://rusinfocenter.viiversion.com/notification"

          fetch_page() {
            local url="$1"
            local out="$2"
            local code=""
            for _ in $(seq 1 30); do
              code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 25 --output "$out" --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]] && [[ -s "$out" ]]; then
                echo "OK $url HTTP 200"
                return 0
              fi
              sleep 6
            done
            echo "FAIL $url HTTP ${code:-none}" >&2
            return 1
          }

          require_text() {
            local file="$1"
            local text="$2"
            local label="$3"
            grep -Fq "$text" "$file" || { echo "FAIL missing $label" >&2; return 1; }
            echo "OK $label"
          }

          reject_text() {
            local file="$1"
            local text="$2"
            local label="$3"
            if grep -Fq "$text" "$file"; then
              echo "FAIL unexpected $label" >&2
              return 1
            fi
            echo "OK absent $label"
          }

          main="$(mktemp)"
          custom_main="$(mktemp)"
          products="$(mktemp)"
          booking="$(mktemp)"
          industries="$(mktemp)"
          tourism="$(mktemp)"
          solutions="$(mktemp)"
          cases="$(mktemp)"
          enterprise="$(mktemp)"
          labs="$(mktemp)"
          prototypes="$(mktemp)"
          pet_case="$(mktemp)"
          uniq_case="$(mktemp)"
          ric_case="$(mktemp)"
          pet_live="$(mktemp)"
          uniq_live="$(mktemp)"
          ric_live="$(mktemp)"
          ric_bot="$(mktemp)"

          fetch_page "$BASE/" "$main"
          fetch_page "$CUSTOM/" "$custom_main"
          fetch_page "$BASE/products/" "$products"
          fetch_page "$BASE/products/booking/" "$booking"
          fetch_page "$BASE/industries/" "$industries"
          fetch_page "$BASE/industries/tourism/" "$tourism"
          fetch_page "$BASE/solutions/" "$solutions"
          fetch_page "$BASE/cases/" "$cases"
          fetch_page "$BASE/enterprise/" "$enterprise"
          fetch_page "$BASE/labs/" "$labs"

          require_text "$main" "Product × Industry" "new homepage product matrix"
          require_text "$main" "B2B2B & Enterprise" "new homepage B2B2B lane"
          require_text "$custom_main" "Product × Industry" "viiversion.com new homepage"
          require_text "$products" "Продуктовые ядра VIIVERSION" "products index"
          require_text "$booking" "Booking Start" "booking product page"
          require_text "$industries" "Отраслевые конфигурации" "industries index"
          require_text "$tourism" "Booking Start" "tourism industry page"
          require_text "$solutions" "Решения вокруг конкретной бизнес-задачи" "solutions index"
          require_text "$cases" "Кейсы как доказательство" "cases index"
          require_text "$enterprise" "Paid Discovery" "enterprise page"
          require_text "$labs" "Собственные продукты VIIVERSION" "labs page"

          # Legacy proof library remains published.
          fetch_page "$BASE/prototypes.html" "$prototypes"
          fetch_page "$BASE/cases/pet-nika.html" "$pet_case"
          fetch_page "$BASE/cases/uniq-smart-rent.html" "$uniq_case"
          fetch_page "$BASE/cases/ric.html" "$ric_case"
          fetch_page "$PET" "$pet_live"
          fetch_page "$UNIQ" "$uniq_live"
          fetch_page "$RIC" "$ric_live"
          fetch_page "$RIC_BOT" "$ric_bot"

          require_text "$prototypes" "$PET" "prototypes -> PET NIKA"
          require_text "$prototypes" "$UNIQ" "prototypes -> UNIQ SMART RENT"
          require_text "$prototypes" "$RIC" "prototypes -> RIC Mini App"
          require_text "$prototypes" "$RIC_BOT" "prototypes -> RIC Telegram prototype"
          reject_text "$prototypes" "$PET_BROKEN" "broken PET /miniapp on prototypes"
          require_text "$pet_case" "$PET" "PET legacy case -> PET NIKA"
          require_text "$uniq_case" "$UNIQ" "UNIQ legacy case -> UNIQ SMART RENT"
          require_text "$ric_case" "$RIC" "RIC legacy case -> Mini App"
          require_text "$ric_case" "$RIC_BOT" "RIC legacy case -> Telegram prototype"
          require_text "$pet_live" "PET NIKA" "PET live prototype content"
          require_text "$uniq_live" "UNIQ" "UNIQ live prototype content"
          require_text "$ric_live" "РИЦ" "RIC live Mini App content"

          rm -f "$main" "$custom_main" "$products" "$booking" "$industries" "$tourism" "$solutions" "$cases" "$enterprise" "$labs" "$prototypes" "$pet_case" "$uniq_case" "$ric_case" "$pet_live" "$uniq_live" "$ric_live" "$ric_bot"
          echo "PUBLIC PRODUCT QA PASS"
