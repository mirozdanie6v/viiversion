name: Public smoke check

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

concurrency:
  group: viiversion-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public commercial site and proof routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://landing.viiversion.workers.dev"
          CUSTOM="https://viiversion.com"
          PET="https://pet-nika.viiversion.com/"
          UNIQ="https://uniq-smart-rent.mirozdanie6v.workers.dev/"
          RIC="https://rusinfocenter.viiversion.com/"

          fetch_page() {
            local url="$1"; local out="$2"; local code=""
            for _ in $(seq 1 30); do
              code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 25 --output "$out" --write-out '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]] && [[ -s "$out" ]]; then echo "OK $url HTTP 200"; return 0; fi
              sleep 6
            done
            echo "FAIL $url HTTP ${code:-none}" >&2; return 1
          }
          require_text(){ grep -Fq "$2" "$1" || { echo "FAIL missing $3" >&2; return 1; }; echo "OK $3"; }
          reject_text(){ if grep -Fq "$2" "$1"; then echo "FAIL unexpected $3" >&2; return 1; fi; echo "OK absent $3"; }

          main="$(mktemp)"; custom="$(mktemp)"; en="$(mktemp)"; en_cases="$(mktemp)"; js="$(mktemp)"; booking="$(mktemp)"; offer="$(mktemp)"
          target="$(mktemp)"; tourism="$(mktemp)"; cases="$(mktemp)"; enterprise="$(mktemp)"; labs="$(mktemp)"
          prototypes="$(mktemp)"; pet="$(mktemp)"; uniq="$(mktemp)"; ric="$(mktemp)"

          fetch_page "$BASE/" "$main"
          fetch_page "$CUSTOM/" "$custom"
          fetch_page "$CUSTOM/en/" "$en"
          fetch_page "$CUSTOM/en/cases/" "$en_cases"
          fetch_page "$CUSTOM/assets/viiversion.js" "$js"
          fetch_page "$BASE/products/booking/" "$booking"
          fetch_page "$BASE/offers/booking-start/" "$offer"
          fetch_page "$BASE/solutions/tourism/booking/" "$target"
          fetch_page "$BASE/industries/tourism/" "$tourism"
          fetch_page "$BASE/cases/" "$cases"
          fetch_page "$BASE/enterprise/" "$enterprise"
          fetch_page "$BASE/labs/" "$labs"

          require_text "$main" "Автоматизируем продажи и операции" "new commercial hero"
          require_text "$main" "Рабочие демо и прототипы" "proof moved above fold sequence"
          require_text "$main" "Начните с одной небольшой задачи" "entry offers"
          require_text "$main" 'class="lead-form"' "conversion form"
          require_text "$custom" "Автоматизируем продажи и операции" "custom domain homepage"
          require_text "$en" "Automate sales and operations" "English homepage"
          require_text "$en" 'href="/en/solutions/"' "English navigation"
          reject_text "$en" '/en/en/' "double English prefix"
          require_text "$en_cases" "WORKING DEMO" "English proof status"
          reject_text "$en_cases" "РАБОЧЕЕ ДЕМО" "Russian status in English cases"
          require_text "$js" "/__conversion/" "conversion analytics"
          require_text "$booking" "Как процесс выглядит сейчас" "Booking before/after"
          require_text "$offer" "8–18M ₫" "Booking Start price"
          require_text "$target" "Турист бронирует экскурсию сам" "Tourism × Booking landing"
          require_text "$tourism" "Онлайн-продажи и бронирование" "deep tourism page"
          require_text "$cases" "РАБОЧЕЕ ДЕМО" "proof statuses"
          require_text "$enterprise" "Сложные внутренние системы" "enterprise copy"
          require_text "$labs" "ЗАКРЫТАЯ БЕТА" "labs statuses"
          reject_text "$main" "коммерческих ядер" "internal jargon"
          reject_text "$main" "buyer journey" "buyer jargon"
          reject_text "$main" "Большая продажа" "internal sales language"

          fetch_page "$BASE/prototypes.html" "$prototypes"
          fetch_page "$PET" "$pet"
          fetch_page "$UNIQ" "$uniq"
          fetch_page "$RIC" "$ric"
          require_text "$prototypes" "$PET" "legacy proof -> PET"
          require_text "$prototypes" "$UNIQ" "legacy proof -> UNIQ"
          require_text "$pet" "PET NIKA" "PET live"
          require_text "$uniq" "UNIQ" "UNIQ live"
          require_text "$ric" "РИЦ" "RIC live"

          rm -f "$main" "$custom" "$en" "$en_cases" "$js" "$booking" "$offer" "$target" "$tourism" "$cases" "$enterprise" "$labs" "$prototypes" "$pet" "$uniq" "$ric"
          echo "PUBLIC COMMERCIAL QA PASS"
