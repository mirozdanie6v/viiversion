name: VIIVERSION build QA

on:
  push:
    branches:
      - viiversion
  pull_request:
    branches:
      - viiversion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Verify industry-first commercial architecture
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/en/index.html
          test -s public/modules/index.html
          test -s public/modules/online-booking/index.html
          test -s public/modules/telegram-mini-app/index.html
          test -s public/modules/crm/index.html
          test -s public/modules/ai-consultant/index.html
          test -s public/modules/payment-integration/index.html
          test -s public/assets/team/dmitrii.webp
          test -s public/assets/team/olga.webp
          test -s public/cases/index.html
          test -s public/enterprise/index.html
          grep -Fq "Цифровые решения для конкретных задач бизнеса" public/index.html
          grep -Fq "Что можно купить для вашего бизнеса" public/index.html
          grep -Fq 'data-industry-tab="tourism"' public/index.html
          grep -Fq 'data-industry-tab="hotels"' public/index.html
          grep -Fq 'data-industry-tab="shops"' public/index.html
          grep -Fq "Онлайн-бронирование" public/index.html
          grep -Fq "CRM для заявок и заказов" public/index.html
          grep -Fq "AI-консультант" public/index.html
          grep -Fq "Подключение оплаты" public/index.html
          grep -Fq "Вы общаетесь напрямую с теми, кто делает продукт" public/index.html
          grep -Fq "/assets/team/dmitrii.webp" public/index.html
          grep -Fq "/assets/team/olga.webp" public/index.html
          grep -Fq "Что входит и как начать" public/index.html
          grep -Fq "Что мы не будем делать без согласования" public/modules/online-booking/index.html
          grep -Fq "8–18M ₫" public/modules/online-booking/index.html
          grep -Fq 'class="lead-form"' public/index.html
          grep -Fq '/__conversion/' public/assets/viiversion.js
          grep -Fq 'viiversion_campaign' public/assets/viiversion.js
          grep -Fq 'landingPage' public/assets/viiversion.js
          grep -Fq 'href="/en/solutions/"' public/en/index.html
          ! grep -Fq '/en/en/' public/en/index.html
          ! grep -Fq "коммерческих ядер" public/index.html
          ! grep -Fq "buyer journey" public/index.html
          ! grep -Fq "Большая продажа" public/index.html
