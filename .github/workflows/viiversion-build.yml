name: VIIVERSION build QA

on:
  push:
    branches:
      - viiversion
  pull_request:
    branches:
      - viiversion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Verify canonical product architecture
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/en/index.html
          test -s public/products/index.html
          test -s public/products/online-booking/index.html
          test -s public/products/telegram-mini-app/index.html
          test -s public/products/catalog/index.html
          test -s public/products/crm/index.html
          test -s public/products/ai-consultant/index.html
          test -s public/products/payment-integration/index.html
          test -s public/products/system-integration/index.html
          test -s public/software/index.html
          test -s public/partners/index.html
          test -s public/enterprise/index.html
          test -s public/privacy/index.html
          test -s public/en/privacy/index.html
          # Every direction has an RU/EN detail page and can be opened from the hero.
          for slug in customer-systems business-operations process-automation ai-systems integrations-payments data-enterprise; do
            test -s "public/solutions/$slug/index.html"
            test -s "public/en/solutions/$slug/index.html"
            grep -Fq "href=\"/solutions/$slug/\"" public/index.html
            grep -Fq "href=\"/en/solutions/$slug/\"" public/en/index.html
          done
          for key in a b c d e f; do
            grep -Fq "data-direction-tab=\"$key\"" public/index.html
            grep -Fq "data-direction-panel=\"$key\"" public/index.html
            grep -Fq "aria-controls=\"direction-panel-$key\"" public/index.html
          done
          grep -Fq 'const directionPanels=' public/assets/viiversion.js
          grep -Fq 'scrollIntoView' public/assets/viiversion.js
          grep -Fq "Клиентская база" public/solutions/business-operations/index.html
          grep -Fq "AI-разбор входящей информации" public/solutions/ai-systems/index.html
          grep -Fq "Подключение оплаты" public/solutions/integrations-payments/index.html
          ! grep -Fq "P11" public/solutions/business-operations/index.html
          ! grep -Fq "P13" public/solutions/business-operations/index.html
          python3 -m py_compile scripts/site_directions.py scripts/build-product-site.py
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from site_directions import validate_direction_catalog; validate_direction_catalog()"
          test -s public/assets/team/dmitrii.webp
          test -s public/assets/team/olga.webp
          test -s public/assets/cases/max-tour.webp
          test -s public/assets/cases/uniq-smart-rent.webp
          test -s public/assets/cases/pet-nika.webp

          grep -Fq "Разработка кастомных ИТ-систем, мобильных приложений и сквозных интеграций." public/index.html
          grep -Fq "Четыре контура одной цифровой системы" public/index.html
          grep -Fq "Системы, которые можно открыть и проверить" public/index.html
          grep -Fq "Компоненты — ниже уровнем, чем сама система" public/index.html
          grep -Fq 'data-industry-tab="hotels"' public/index.html
          grep -Fq 'data-industry-tab="shops"' public/index.html
          ! grep -Fq 'data-industry-tab="enterprise"' public/index.html

          grep -Fq "Первый пакет" public/products/online-booking/index.html
          grep -Fq "8–18M ₫" public/products/online-booking/index.html
          grep -Fq "Что входит в продукт" public/products/online-booking/index.html
          grep -Fq "Можно подключить дополнительно" public/products/online-booking/index.html
          grep -Fq "Интеграция двух систем" public/products/system-integration/index.html

          grep -Fq 'noindex,follow' public/modules/online-booking/index.html
          grep -Fq '/products/online-booking/' public/modules/online-booking/index.html
          grep -Fq 'noindex,follow' public/offers/booking-start/index.html
          grep -Fq '/products/online-booking/' public/offers/booking-start/index.html
          ! grep -Fq '<loc>https://viiversion.com/modules/' public/sitemap.xml
          ! grep -Fq '<loc>https://viiversion.com/offers/' public/sitemap.xml

          grep -Fq '/api/leads' public/assets/viiversion.js
          grep -Fq 'landingPage' public/assets/viiversion.js
          grep -Fq 'class="lead-form"' public/index.html
          grep -Fq 'href="/en/products/"' public/en/index.html
          grep -Fq 'href="/en/cases/"' public/en/index.html
          grep -Fq 'href="/en/enterprise/"' public/en/index.html
          ! grep -Fq '/en/en/' public/en/index.html

          ! grep -Fq "Booking Start" public/index.html
          ! grep -Fq "Operations Core" public/index.html
          ! grep -Fq "коммерческих ядер" public/index.html

          # Product data must have exactly one source of truth.
          grep -Fq "SELLABLE_PRODUCTS = {" scripts/product_catalog.py
          grep -Fq "INDUSTRY_CONFIGS = {" scripts/product_catalog.py
          ! grep -Eq '^(PRODUCTS|OFFERS|MODULES|INDUSTRY_EXPLORER|LABS) = ' scripts/site_content.py
          grep -Fq "Заявки сохраняются" public/privacy/index.html

      - name: Validate Worker and Durable Object config
        run: |
          set -euo pipefail
          node --check src/worker.js
          npx wrangler deploy --dry-run --outdir /tmp/viiversion-worker
