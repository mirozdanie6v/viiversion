name: Personal Web staging deployment

on:
  push:
    branches: [feat/personal-web-firecrawl-mvp]
    paths:
      - "personal-web/**"
      - ".github/workflows/personal-web-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-web-staging
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: personal-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PERSONAL_WEB_API_TOKEN: ${{ secrets.PERSONAL_WEB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and verify code
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npx wrangler deploy --dry-run
      - name: Check Cloudflare credentials without exposing values
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare deployment credentials are not configured"
            exit 1
          fi
          npx wrangler whoami
      - name: Deploy only the separate personal-web staging Worker
        run: |
          set -euo pipefail
          WORKER_URL="https://viiversion-personal-web-staging.viiversion.workers.dev"
          for attempt in 1 2 3; do
            if npx wrangler deploy --name viiversion-personal-web-staging; then
              echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
              echo "Staging Worker deployed: $WORKER_URL"
              exit 0
            fi
            echo "::warning::Cloudflare deployment attempt $attempt failed; retrying transient API errors"
            sleep 7
          done
          echo "::error::Cloudflare deployment did not succeed after 3 attempts"
          exit 1
      - name: Set private bearer token (never print it)
        run: |
          set -euo pipefail
          if [ -n "$PERSONAL_WEB_API_TOKEN" ] && [ "${#PERSONAL_WEB_API_TOKEN}" -ge 32 ]; then
            TOKEN="$PERSONAL_WEB_API_TOKEN"
          else
            TOKEN="$(openssl rand -hex 32)"
            echo "::notice::Temporary staging token generated. Configure the PERSONAL_WEB_API_TOKEN repository secret for durable owner access."
          fi
          echo "::add-mask::$TOKEN"
          printf "%s" "$TOKEN" | npx wrangler secret put WEB_API_TOKEN --name viiversion-personal-web-staging
          echo "SMOKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Live Cloudflare browser smoke (approved site only)
        run: |
          set -euo pipefail
          READY=false
          for i in $(seq 1 20); do
            code="$(curl --silent --show-error --max-time 12 --output /tmp/pw-health.json --write-out '%{http_code}' "$WORKER_URL/health" || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true and .configured == true' /tmp/pw-health.json > /dev/null 2>&1; then
              READY=true
              break
            fi
            echo "Cloudflare staging propagation check $i: HTTP $code"
            sleep 3
          done
          if [ "$READY" != "true" ]; then
            echo "::error::Worker /health not reachable after retries; last HTTP response:"
            cat /tmp/pw-health.json
            exit 1
          fi
          AUTH_READY=false
          for i in $(seq 1 20); do
            auth_code="$(curl --silent --show-error --max-time 15 --output /tmp/pw-auth.json --write-out '%{http_code}' \
              -X POST "$WORKER_URL/mcp" \
              -H "authorization: Bearer $SMOKE_TOKEN" \
              -H "content-type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' || true)"
            if [ "$auth_code" = "200" ] && jq -e '.result.tools | length >= 6' /tmp/pw-auth.json > /dev/null 2>&1; then
              AUTH_READY=true
              break
            fi
            echo "Cloudflare secret propagation check $i: HTTP $auth_code"
            sleep 3
          done
          if [ "$AUTH_READY" != "true" ]; then
            echo "::error::New WEB_API_TOKEN did not become active within the bounded retry window"
            exit 1
          fi
          unauth="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            -X POST "$WORKER_URL/v1/scrape" -H 'content-type: application/json' -d '{"url":"https://viiversion.com/"}')"
          test "$unauth" = 401
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/v1/scrape" \
            -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/"}' > /tmp/pw-scrape.json
          jq -e '.ok == true and (.document.url | startswith("https://viiversion.com")) and (.document.title | type == "string")' /tmp/pw-scrape.json > /dev/null
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/mcp" \
            -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' > /tmp/pw-mcp.json
          jq -e '.result.tools | length >= 6' /tmp/pw-mcp.json > /dev/null
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/v1/extract" -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/","fields":{"headline":"h1"}}' > /tmp/pw-extract.json
          jq -e '.ok == true and (.data | has("headline"))' /tmp/pw-extract.json > /dev/null
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/v1/map" -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/","limit":1,"depth":0}' > /tmp/pw-map.json
          jq -e '.ok == true and .visitedPages == 1' /tmp/pw-map.json > /dev/null
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/v1/crawl" -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/","limit":1,"depth":0}' > /tmp/pw-crawl.json
          jq -e '.ok == true and (.documents | length == 1)' /tmp/pw-crawl.json > /dev/null
          curl --fail --silent --show-error --max-time 100 \
            -X POST "$WORKER_URL/v1/screenshot" -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/","fullPage":false}' > /tmp/pw-screenshot.png
          test "$(head -c 8 /tmp/pw-screenshot.png | od -An -tx1 | tr -d ' \\n')" = "89504e470d0a1a0a"
          disabled="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 \
            -X POST "$WORKER_URL/v1/interact" -H "authorization: Bearer $SMOKE_TOKEN" \
            -H "content-type: application/json" \
            -d '{"url":"https://viiversion.com/","actions":[]}' )"
          test "$disabled" = 403
          echo "Live scrape, extract, map, crawl, screenshot, MCP and authorization smoke passed on $WORKER_URL"
