name: Inspect analytics endpoint

on:
  push:
    branches: [viiversion]
    paths:
      - ".github/workflows/inspect-analytics.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test analytics endpoint
        run: |
          set -euo pipefail
          code="$(curl -sS -o response.txt -w '%{http_code}' -X POST https://dashboard.viiversion.com/api/collect             -H 'content-type: text/plain;charset=UTF-8'             --data '{"eventType":"pageview","project":"VIIVERSION","hostname":"viiversion.com","path":"/__conversion/lead-submit","pageUrl":"https://viiversion.com/__conversion/lead-submit","title":"Conversion: lead_submit | QA","queryString":"?source=qa","visitorId":"qa-conversion-check","sessionId":"qa-conversion-check","occurredAt":"2026-09-21T12:20:00.000Z"}')"
          echo "HTTP $code"
          cat response.txt
          test "$code" -ge 200
          test "$code" -lt 300
