name: Deploy VIIVERSION Brain

on:
  workflow_dispatch:
  push:
    branches:
      - brain-v0.1-bootstrap
    paths:
      - 'brain/runtime/**'
      - '.github/workflows/deploy-brain.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain/runtime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-v0.1-bootstrap
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
      - name: Enforce stable independent credentials before any production mutation
        shell: bash
        env:
          CONFIGURED_BRAIN_API_TOKEN: ${{ secrets.BRAIN_API_TOKEN }}
          CONFIGURED_BRAIN_APPROVAL_TOKEN: ${{ secrets.BRAIN_APPROVAL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${#CONFIGURED_BRAIN_API_TOKEN}" -lt 32 ]; then
            echo "::error::Configure stable BRAIN_API_TOKEN (>=32 chars) in GitHub Actions Secrets. Existing Worker is unchanged."
            exit 1
          fi
          if [ "${#CONFIGURED_BRAIN_APPROVAL_TOKEN}" -lt 32 ]; then
            echo "::error::Configure independent stable BRAIN_APPROVAL_TOKEN (>=32 chars). Existing Worker is unchanged."
            exit 1
          fi
          if [ "$CONFIGURED_BRAIN_API_TOKEN" = "$CONFIGURED_BRAIN_APPROVAL_TOKEN" ]; then
            echo "::error::Brain read and approval credentials must differ."
            exit 1
          fi
          echo "::add-mask::$CONFIGURED_BRAIN_API_TOKEN"
          echo "::add-mask::$CONFIGURED_BRAIN_APPROVAL_TOKEN"
          echo "BRAIN_TEST_TOKEN=$CONFIGURED_BRAIN_API_TOKEN" >> "$GITHUB_ENV"
          echo "BRAIN_TEST_APPROVAL_TOKEN=$CONFIGURED_BRAIN_APPROVAL_TOKEN" >> "$GITHUB_ENV"
      - name: Set protected Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BRAIN_TEST_TOKEN" | npx wrangler secret put BRAIN_API_TOKEN --config wrangler.jsonc
          printf '%s' "$BRAIN_TEST_APPROVAL_TOKEN" | npx wrangler secret put BRAIN_APPROVAL_TOKEN --config wrangler.jsonc
      - name: Apply existing D1 migrations
        run: npx wrangler d1 migrations apply viiversion-brain --remote --config wrangler.jsonc
      - name: Deploy Worker and Workflow
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Remote fresh-session checkpoint E2E
        env:
          BRAIN_TEST_BASE: https://viiversion-brain.viiversion.workers.dev
        run: node tests/live-smoke.mjs
      - name: Independent process restores persisted CEO context
        env:
          BRAIN_TEST_BASE: https://viiversion-brain.viiversion.workers.dev
        run: node tests/live-resume.mjs
      - name: Import private founder-approved commitments when temporary secret is present
        shell: bash
        env:
          BRAIN_TEST_BASE: https://viiversion-brain.viiversion.workers.dev
          BRAIN_COMMITMENTS_IMPORT_B64: ${{ secrets.BRAIN_COMMITMENTS_IMPORT_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${BRAIN_COMMITMENTS_IMPORT_B64:-}" ]; then
            echo "SKIP: one-time private import not configured; real commercial agreements are NOT verified in D1."
          else
            node tests/import-private-commitments.mjs
          fi
      - name: Independent process restores private client decisions and saved plan
        if: ${{ env.BRAIN_PRIVATE_IMPORT_DONE == 'true' }}
        env:
          BRAIN_TEST_BASE: https://viiversion-brain.viiversion.workers.dev
        run: node tests/private-commitments-resume.mjs
