name: Deploy VIIVERSION Brain

on:
  workflow_dispatch:
  push:
    branches:
      - brain-v0.1-bootstrap
    paths:
      - 'brain/runtime/**'
      - '.github/workflows/deploy-brain.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain/runtime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-v0.1-bootstrap
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
      - name: Prepare protected Brain test credential
        shell: bash
        env:
          CONFIGURED_BRAIN_API_TOKEN: ${{ secrets.BRAIN_API_TOKEN }}
        run: |
          set -euo pipefail
          token="${CONFIGURED_BRAIN_API_TOKEN:-}"
          if [ -z "$token" ]; then
            # Bootstrap-only: replace with a stable GitHub BRAIN_API_TOKEN secret when clients are connected.
            token="$(openssl rand -hex 32)"
          fi
          test "${#token}" -ge 32
          echo "::add-mask::$token"
          echo "BRAIN_TEST_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Set protected Worker credential
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BRAIN_TEST_TOKEN" | npx wrangler secret put BRAIN_API_TOKEN --config wrangler.jsonc
      - name: Apply existing D1 migrations
        run: npx wrangler d1 migrations apply viiversion-brain --remote --config wrangler.jsonc
      - name: Deploy Worker and Workflow
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Remote fresh-session checkpoint E2E
        env:
          BRAIN_TEST_BASE: https://viiversion-brain.viiversion.workers.dev
        run: node tests/live-smoke.mjs
