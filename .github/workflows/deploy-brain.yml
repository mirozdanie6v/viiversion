name: Deploy VIIVERSION Brain

on:
  workflow_dispatch:
  push:
    branches:
      - brain-v0.1-bootstrap
    paths:
      - 'brain/runtime/**'
      - '.github/workflows/deploy-brain.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: brain/runtime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brain-v0.1-bootstrap
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: Verify Cloudflare authentication
        run: npx wrangler whoami
      - name: Find or create Brain D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          # Provisioning only: inspect Wrangler's normal output; no unsupported JSON flags.
          npx wrangler d1 list | tee /tmp/d1-list.txt
          id="$(grep 'viiversion-brain' /tmp/d1-list.txt | grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' | head -n1 || true)"
          if [ -z "$id" ]; then
            npx wrangler d1 create viiversion-brain | tee /tmp/d1-create.txt
            id="$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' /tmp/d1-create.txt | head -n1 || true)"
          fi
          test -n "$id"
          echo "database_id=$id" >> "$GITHUB_OUTPUT"
      - name: Bind D1 id
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='wrangler.jsonc'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.d1_databases[0].database_id=process.env.DB; fs.writeFileSync(p,JSON.stringify(x,null,2)+'\n')" 
        env:
          DB: ${{ steps.d1.outputs.database_id }}
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply viiversion-brain --remote --config wrangler.jsonc
      - name: Deploy Worker and Workflow
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Persist D1 binding to branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain/runtime/wrangler.jsonc
          git diff --cached --quiet || git commit -m "brain: bind provisioned D1"
          git push origin HEAD:brain-v0.1-bootstrap
