name: Harden Telegram analytics tracker

on:
  push:
    branches: [dashboard]
    paths: ['.harden-telegram-tracker']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dashboard
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Harden opaque Telegram WebView origins
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/worker/index.ts';
          let s = fs.readFileSync(p, 'utf8');
          const anchor = "  if (!origin) return { origin: '', hostname: '' };";
          const replacement = "  if (!origin) return { origin: '', hostname: '' };\n  if (origin === 'null') return { origin: 'null', hostname: '' };";
          if (!s.includes("origin === 'null'")) {
            if (!s.includes(anchor)) throw new Error('collectorOrigin anchor not found');
            s = s.replace(anchor, replacement);
          }
          fs.writeFileSync(p, s);
          NODE
          grep -Fq "origin === 'null'" src/worker/index.ts
          grep -Fq "mode: 'no-cors'" public/tracker.js
          grep -Fq "platform !== 'unknown'" public/tracker.js
      - name: Commit collector hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain -- src/worker/index.ts)" ]; then
            git add src/worker/index.ts
            git commit -m 'fix: accept opaque Telegram WebView origins in analytics collector'
            git push origin HEAD:dashboard
          else
            echo 'Collector already supports opaque origins.'
          fi
