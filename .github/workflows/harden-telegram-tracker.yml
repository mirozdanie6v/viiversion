name: Harden Telegram analytics tracker

on:
  push:
    branches: [dashboard]
    paths: ['.harden-telegram-tracker']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dashboard
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Harden Telegram detection and transport
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'public/tracker.js';
          let s = fs.readFileSync(p, 'utf8');
          const oldDetect = "    const detected = Boolean(webApp?.initData || launchParam('tgWebAppData') || platform || version);";
          const newDetect = "    const launchData = launchParam('tgWebAppData');\n    const launchPlatform = launchParam('tgWebAppPlatform');\n    const launchVersion = launchParam('tgWebAppVersion');\n    const sdkPlatformIsReal = Boolean(platform && platform !== 'unknown');\n    const detected = Boolean(webApp?.initData || launchData || (sdkPlatformIsReal && (launchPlatform || launchVersion)));";
          if (!s.includes(oldDetect)) throw new Error('Telegram detection anchor not found');
          s = s.replace(oldDetect, newDetect);
          if (!s.includes("mode: 'cors',")) throw new Error('CORS transport anchor not found');
          s = s.replace("mode: 'cors',", "mode: 'no-cors',");
          fs.writeFileSync(p, s);
          NODE
          grep -Fq "platform !== 'unknown'" public/tracker.js
          grep -Fq "mode: 'no-cors'" public/tracker.js
          ! grep -Fq "mode: 'cors'" public/tracker.js
      - name: Commit tracker hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/tracker.js
          git commit -m 'fix: harden Telegram Mini App analytics detection and transport'
          git push origin HEAD:dashboard
