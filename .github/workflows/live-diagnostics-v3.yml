name: Live diagnostics

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

concurrency:
  group: viiversion-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live VIIVERSION product site
        env:
          TARGET_URL: https://viiversion.com/
        run: |
          cat > diagnose-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const target=process.env.TARGET_URL;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache','Pragma':'no-cache'});

            let deployed=false;
            for(let i=0;i<30;i++){
              await page.goto(`${target}?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(900);
              deployed=await page.locator('[data-matrix-product="all"]').count()>0 &&
                       (await page.locator('body').innerText()).includes('Product × Industry');
              if(deployed) break;
              await page.waitForTimeout(5000);
            }
            if(!deployed) throw new Error('New product architecture is not live yet');

            const toggle=page.locator('.mobile-toggle');
            if(!(await toggle.isVisible())) throw new Error('Mobile navigation toggle is not visible');
            await toggle.click();
            await page.waitForTimeout(150);
            if(!(await page.locator('.nav.open').isVisible())) throw new Error('Mobile navigation did not open');

            await page.locator('.nav.open a[href="/products/"]').click();
            await page.waitForLoadState('domcontentloaded');
            if(!page.url().includes('/products/')) throw new Error('Products navigation did not open /products/');
            if(!(await page.locator('body').innerText()).includes('Продуктовые ядра VIIVERSION')) throw new Error('Products page marker missing');

            await page.goto(new URL('/products/booking/',target).href,{waitUntil:'domcontentloaded',timeout:120000});
            if(!(await page.locator('body').innerText()).includes('Booking Start')) throw new Error('Booking product page marker missing');

            await page.goto(new URL('/industries/tourism/',target).href,{waitUntil:'domcontentloaded',timeout:120000});
            if(!(await page.locator('body').innerText()).includes('Booking Start')) throw new Error('Tourism industry page marker missing');

            await page.goto(target,{waitUntil:'domcontentloaded',timeout:120000});
            const allResults=await page.locator('[data-products]').count();
            await page.locator('[data-matrix-product="booking"]').click();
            await page.waitForTimeout(120);
            const hidden=await page.locator('[data-products].hidden').count();
            if(allResults<2 || hidden<1) throw new Error('Product × Industry filter did not change visible results');

            const routes=['/solutions/','/cases/','/enterprise/','/labs/'];
            for(const route of routes){
              const response=await page.goto(new URL(route,target).href,{waitUntil:'domcontentloaded',timeout:120000});
              if(!response || response.status()!==200) throw new Error(`Route failed: ${route}`);
            }

            await page.goto(target,{waitUntil:'networkidle',timeout:120000});
            await page.screenshot({path:'viiversion-product-site-mobile.png',fullPage:true});
            const result={target,deployed,allResults,hidden,finalUrl:page.url()};
            fs.writeFileSync('viiversion-product-site-live.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{
            fs.writeFileSync('viiversion-product-site-live-error.txt',String(e&&e.stack||e));
            console.error(e);
            process.exitCode=1;
          });
          JS
          node diagnose-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viiversion-product-site-live
          path: |
            viiversion-product-site-live.json
            viiversion-product-site-live-error.txt
            viiversion-product-site-mobile.png
          if-no-files-found: warn
