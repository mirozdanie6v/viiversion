name: Live diagnostics v3

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live menu and sticky mobile header
        env:
          TARGET_URL: https://viiversion.com/
        run: |
          cat > diagnose-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const target=process.env.TARGET_URL;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache','Pragma':'no-cache'});

            let deployed=false;
            for(let i=0;i<18;i++){
              await page.goto(`${target}?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(1200);
              deployed=await page.evaluate(()=>!!document.querySelector('#viiversion-before-menu-sticky-style'));
              if(deployed)break;
              await page.waitForTimeout(5000);
            }
            if(!deployed)throw new Error('Latest Before-development/sticky patch is not live yet');

            const norm=v=>(v||'').replace(/\s+/g,' ').trim();
            const state=async label=>page.evaluate(label=>{
              const norm=v=>(v||'').replace(/\s+/g,' ').trim();
              const section=document.querySelector('#before,[data-viiv-before-development="true"]');
              const link=document.querySelector('[data-viiv-before-menu="true"]');
              const header=document.querySelector('.viiv-mobile-sticky-header');
              const hs=header?getComputedStyle(header):null;
              const hr=header?header.getBoundingClientRect():null;
              const sr=section?section.getBoundingClientRect():null;
              return {
                label,
                sectionFound:!!section,
                sectionHeading:norm((section&&section.querySelector('#beforeH,h2,h3,[role="heading"]')||{}).textContent),
                menuFound:!!link,
                menuLabel:link?norm(link.textContent):'',
                menuHref:link?link.getAttribute('href'):'',
                headerFound:!!header,
                headerPosition:hs?hs.position:'',
                headerTop:hr?Math.round(hr.top):null,
                headerBottom:hr?Math.round(hr.bottom):null,
                headerOpacity:hs?hs.opacity:'',
                headerVisibility:hs?hs.visibility:'',
                sectionTop:sr?Math.round(sr.top):null,
                scrollY:Math.round(window.scrollY)
              };
            },label);

            const ruTop=await state('ru-top');
            await page.screenshot({path:'mobile-before-top.png',fullPage:false});

            await page.evaluate(()=>window.scrollTo(0,Math.max(900,document.body.scrollHeight*.48)));
            await page.waitForTimeout(900);
            const ruScrolled=await state('ru-scrolled');
            await page.screenshot({path:'mobile-before-scrolled.png',fullPage:false});

            const beforeLink=page.locator('[data-viiv-before-menu="true"]').first();
            await beforeLink.click();
            await page.waitForTimeout(1200);
            const ruAnchored=await state('ru-anchored');

            const clickLang=async lang=>{
              const buttons=page.locator('.langs button');
              const n=await buttons.count();
              for(let i=0;i<n;i++){
                const b=buttons.nth(i);
                if((await b.innerText()).trim().toUpperCase()===lang){
                  await b.click();
                  await page.waitForTimeout(900);
                  return true;
                }
              }
              return false;
            };

            const enClicked=await clickLang('EN');
            const en=await state('en');
            const viClicked=await clickLang('VI');
            const vi=await state('vi');

            const result={target,deployed,ruTop,ruScrolled,ruAnchored,enClicked,en,viClicked,vi};
            fs.writeFileSync('before-menu-sticky-live.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));

            const failures=[];
            if(!ruTop.sectionFound)failures.push('before section not found');
            if(!ruTop.menuFound||ruTop.menuLabel!=='До разработки'||ruTop.menuHref!=='#before')failures.push('RU Before-development menu item incorrect');
            if(!ruTop.headerFound||ruTop.headerPosition!=='fixed'||Math.abs(ruTop.headerTop)>2)failures.push('mobile header is not fixed at top initially');
            if(!ruScrolled.headerFound||ruScrolled.headerPosition!=='fixed'||Math.abs(ruScrolled.headerTop)>2||ruScrolled.headerVisibility==='hidden'||Number(ruScrolled.headerOpacity)<0.9)failures.push('mobile header disappears after scrolling');
            if(!ruAnchored.sectionFound||ruAnchored.sectionTop===null||ruAnchored.sectionTop<ruAnchored.headerBottom-4||ruAnchored.sectionTop>ruAnchored.headerBottom+80)failures.push('Before-development anchor offset incorrect');
            if(!enClicked||en.menuLabel!=='Before development')failures.push('EN menu label incorrect');
            if(!viClicked||vi.menuLabel!=='Trước phát triển')failures.push('VI menu label incorrect');
            if(failures.length)throw new Error(failures.join('; '));

            await browser.close();
          })().catch(e=>{
            fs.writeFileSync('before-menu-sticky-live-error.txt',String(e&&e.stack||e));
            console.error(e);
            process.exitCode=1;
          });
          JS
          node diagnose-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: before-menu-sticky-live
          path: |
            before-menu-sticky-live.json
            before-menu-sticky-live-error.txt
            mobile-before-top.png
            mobile-before-scrolled.png
          if-no-files-found: warn
