name: Live diagnostics

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

concurrency:
  group: viiversion-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live commercial UX
        env:
          TARGET_URL: https://landing.viiversion.workers.dev/
        run: |
          cat > diagnose-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const target=process.env.TARGET_URL;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache','Pragma':'no-cache'});

            let deployed=false;
            for(let i=0;i<10;i++){
              await page.goto(`${target}?qa=${Date.now()}&utm_source=qa&utm_campaign=commercial`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(700);
              const text=await page.locator('body').innerText();
              deployed=text.includes('Автоматизируем продажи и операции') && await page.locator('.lead-form').count()>0;
              if(deployed) break;
              await page.waitForTimeout(2000);
            }
            if(!deployed) throw new Error('Commercial site version is not live');

            const toggle=page.locator('.mobile-toggle');
            if(!(await toggle.isVisible())) throw new Error('Mobile menu toggle missing');
            await toggle.click(); await page.waitForTimeout(100);
            if(!(await page.locator('.nav.open').isVisible())) throw new Error('Mobile menu did not open');

            await page.goto(new URL('/products/booking/',target).href,{waitUntil:'domcontentloaded',timeout:30000});
            let text=await page.locator('body').innerText();
            if(!text.includes('Как процесс выглядит сейчас')||!text.includes('8–18M ₫')) throw new Error('Booking commercial content missing');

            await page.goto(new URL('/solutions/tourism/booking/',target).href,{waitUntil:'domcontentloaded',timeout:30000});
            text=await page.locator('body').innerText();
            if(!text.includes('Турист бронирует экскурсию сам')) throw new Error('Targeted landing missing');

            await page.goto(new URL('/en/',target).href,{waitUntil:'domcontentloaded',timeout:30000});
            text=await page.locator('body').innerText();
            if(!text.includes('Automate sales and operations')) throw new Error('English homepage missing');

            await page.goto(`${target}?utm_source=qa&utm_campaign=commercial`,{waitUntil:'domcontentloaded',timeout:30000});
            const allResults=await page.locator('[data-products]').count();
            await page.locator('[data-matrix-product="booking"]').click();
            await page.waitForTimeout(100);
            const hidden=await page.locator('[data-products].hidden').count();
            if(allResults<2||hidden<1) throw new Error('Product × Industry filter failed');

            const form=page.locator('.lead-form');
            await form.locator('[name="contact"]').fill('qa@example.com');
            await form.locator('[name="task"]').fill('QA test only');
            const context=await form.locator('[name="page_context"]').inputValue();
            if(!context.includes('"source":"qa"')) throw new Error('UTM context was not captured');

            const routes=['/offers/booking-start/','/industries/rental/','/industries/clinics/','/cases/','/enterprise/','/labs/'];
            for(const route of routes){
              const response=await page.goto(new URL(route,target).href,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||response.status()!==200) throw new Error(`Route failed: ${route}`);
            }

            await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(900);
            await page.screenshot({path:'viiversion-commercial-mobile.png',fullPage:true});
            const result={target,deployed,allResults,hidden};
            fs.writeFileSync('viiversion-commercial-live.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{
            fs.writeFileSync('viiversion-commercial-live-error.txt',String(e&&e.stack||e));
            console.error(e); process.exitCode=1;
          });
          JS
          node diagnose-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viiversion-commercial-live
          path: |
            viiversion-commercial-live.json
            viiversion-commercial-live-error.txt
            viiversion-commercial-mobile.png
          if-no-files-found: warn
