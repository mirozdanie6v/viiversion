name: Live diagnostics v3

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live mobile menu closes after selection
        env:
          TARGET_URL: https://viiversion.com/
        run: |
          cat > diagnose-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async()=>{
            const target=process.env.TARGET_URL;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache','Pragma':'no-cache'});

            let deployed=false;
            for(let i=0;i<24;i++){
              await page.goto(`${target}?qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(1200);
              deployed=await page.evaluate(()=>!!document.querySelector('#viiversion-mobile-menu-close-script'));
              if(deployed)break;
              await page.waitForTimeout(5000);
            }
            if(!deployed)throw new Error('Latest mobile-menu-close patch is not live yet');

            const before=page.locator('[data-viiv-before-menu="true"]').first();
            if(!(await before.count()))throw new Error('Before-development menu item is missing');

            const buttons=page.locator('.viiv-mobile-sticky-header button, header button');
            const count=await buttons.count();
            let toggleIndex=-1;
            for(let i=0;i<count;i++){
              const b=buttons.nth(i);
              if(!(await b.isVisible()))continue;
              const txt=((await b.innerText().catch(()=>''))||'').trim().toUpperCase();
              if(['RU','EN','VI'].includes(txt))continue;
              await b.click();
              await page.waitForTimeout(220);
              if(await before.isVisible()){
                toggleIndex=i;
                break;
              }
              await b.click().catch(()=>{});
              await page.waitForTimeout(120);
            }
            if(toggleIndex<0)throw new Error('Could not discover the mobile menu toggle or open the menu');

            const openSnapshot=await page.evaluate(()=>{
              const link=document.querySelector('[data-viiv-before-menu="true"]');
              const toggle=[...document.querySelectorAll('.viiv-mobile-sticky-header button,header button')].find(b=>{
                const t=(b.textContent||'').trim().toUpperCase();
                return !['RU','EN','VI'].includes(t)&&getComputedStyle(b).display!=='none';
              });
              return {
                linkVisible:!!link&&getComputedStyle(link).display!=='none'&&link.getBoundingClientRect().height>0,
                toggleExpanded:toggle?toggle.getAttribute('aria-expanded'):null,
                scrollY:Math.round(window.scrollY)
              };
            });
            await page.screenshot({path:'mobile-menu-open.png',fullPage:false});

            await before.click();
            await page.waitForTimeout(500);
            const afterSelection=await page.evaluate(()=>{
              const link=document.querySelector('[data-viiv-before-menu="true"]');
              const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>0&&r.width>0&&r.height>0};
              const header=document.querySelector('.viiv-mobile-sticky-header,header');
              const buttons=header?[...header.querySelectorAll('button,[role="button"]')]:[];
              const toggle=buttons.filter(b=>{
                const t=(b.textContent||'').trim().toUpperCase();
                return !['RU','EN','VI'].includes(t)&&visible(b);
              })[0]||null;
              return {
                linkVisible:visible(link),
                toggleExpanded:toggle?toggle.getAttribute('aria-expanded'):null,
                hash:location.hash,
                scrollY:Math.round(window.scrollY)
              };
            });
            await page.screenshot({path:'mobile-menu-after-selection.png',fullPage:false});

            // Reopen and verify Escape also dismisses the menu.
            const toggle=buttons.nth(toggleIndex);
            await toggle.click();
            await page.waitForTimeout(220);
            const reopened=await before.isVisible();
            if(reopened){
              await page.keyboard.press('Escape');
              await page.waitForTimeout(220);
            }
            const afterEscape=await before.isVisible();

            const result={target,deployed,toggleIndex,openSnapshot,afterSelection,reopened,afterEscape};
            fs.writeFileSync('mobile-menu-close-live.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));

            const failures=[];
            if(!openSnapshot.linkVisible)failures.push('menu did not open');
            if(afterSelection.linkVisible)failures.push('menu stays open after selecting a navigation item');
            if(afterSelection.hash!=='#before')failures.push('navigation item did not navigate to #before');
            if(reopened&&afterEscape)failures.push('menu stays open after Escape');
            if(failures.length)throw new Error(failures.join('; '));

            await browser.close();
          })().catch(e=>{
            fs.writeFileSync('mobile-menu-close-live-error.txt',String(e&&e.stack||e));
            console.error(e);
            process.exitCode=1;
          });
          JS
          node diagnose-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-menu-close-live
          path: |
            mobile-menu-close-live.json
            mobile-menu-close-live-error.txt
            mobile-menu-open.png
            mobile-menu-after-selection.png
          if-no-files-found: warn
