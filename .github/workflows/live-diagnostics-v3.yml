name: Live diagnostics v3

on:
  push:
    branches:
      - viiversion
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser diagnostics
        env:
          TARGET_URL: https://viiversion.com/
        run: |
          cat > diagnose-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const target=process.env.TARGET_URL;
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            await page.setExtraHTTPHeaders({'Cache-Control':'no-cache','Pragma':'no-cache'});
            await page.goto(`${target}?lang=ru&qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForTimeout(1800);

            const revealAll=async()=>{
              await page.evaluate(async()=>{
                const h=document.documentElement.scrollHeight;
                for(let y=0;y<h;y+=620){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,45));}
                window.scrollTo(0,0);
              });
              await page.waitForTimeout(300);
            };

            const snap=async label=>page.evaluate(label=>{
              const norm=v=>(v||'').replace(/\s+/g,' ').trim();
              const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const leaf=[...document.querySelectorAll('body *')].filter(el=>visible(el)&&el.children.length===0).map(el=>norm(el.textContent)).filter(Boolean);
              const body=norm(document.body.innerText);
              const pick=sel=>{const el=document.querySelector(sel);if(!el)return null;const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{text:norm(el.textContent).slice(0,180),fontSize:parseFloat(cs.fontSize),lineHeight:parseFloat(cs.lineHeight),letterSpacing:cs.letterSpacing,width:Math.round(r.width),height:Math.round(r.height)}};
              const core={};
              for(const id of ['whoH','beforeH','flowH','capH','effectH','protoH','processH','ctaH']){const e=document.getElementById(id);core[id]=e?norm(e.textContent):null;}
              return {
                label,
                htmlLang:document.documentElement.lang,
                cyrillicChars:(body.match(/[А-Яа-яЁё]/g)||[]).length,
                latinChars:(body.match(/[A-Za-z]/g)||[]).length,
                leaf,core,
                runtime:{final:!!document.querySelector('#viiversion-final-runtime-style'),previewRows:!!document.getElementById('previewRows'),heroH:!!document.querySelector('[data-k="heroH"]'),aboutCards:document.querySelectorAll('#whoProofs .who-proof').length},
                typography:{
                  hero:pick('.hero h1'),
                  section:pick('#whoH'),
                  card:pick('#whoProofs .who-proof>b'),
                  lead:pick('#whoP'),
                  body:pick('#whoProofs .who-proof p'),
                  tag:pick('.viiv-about-tag-live')
                }
              };
            },label);

            const changed=(a,b)=>{const n=Math.max(a.leaf.length,b.leaf.length);let c=0;for(let i=0;i<n;i++)if((a.leaf[i]||'')!==(b.leaf[i]||''))c++;return c};
            const clickLang=async lang=>{
              const el=page.locator(`.langs button[data-lang="${lang.toLowerCase()}"]`);
              if(await el.count()){await el.first().click();await page.waitForTimeout(900);return true;}
              return false;
            };

            await revealAll();
            const ru=await snap('RU');
            await page.screenshot({path:'mobile-ru.png',fullPage:true});
            const enClicked=await clickLang('EN'); await revealAll();
            const en=await snap('EN');
            await page.screenshot({path:'mobile-en.png',fullPage:true});
            const viClicked=await clickLang('VI'); await revealAll();
            const vi=await snap('VI');
            await page.screenshot({path:'mobile-vi.png',fullPage:true});

            const range=(x,a,b)=>x&&x.fontSize>=a&&x.fontSize<=b;
            const checks={
              nativeDomPreserved:ru.runtime.previewRows&&ru.runtime.heroH,
              customRuntimeLoaded:ru.runtime.final,
              aboutCardsPresent:ru.runtime.aboutCards===3,
              ruSelected:ru.htmlLang==='ru'&&ru.cyrillicChars>500,
              enSelected:en.htmlLang==='en'&&en.cyrillicChars<100,
              viSelected:vi.htmlLang==='vi'&&vi.cyrillicChars<100,
              enChangesWholePage:changed(ru,en)>80,
              viChangesWholePage:changed(ru,vi)>80,
              heroScale:range(ru.typography.hero,38,42.5),
              sectionScale:range(ru.typography.section,28,32.5),
              cardScale:range(ru.typography.card,20,22.5),
              leadScale:range(ru.typography.lead,17,18.5),
              bodyScale:range(ru.typography.body,15,16.5),
              tagScale:range(ru.typography.tag,12,13.5)
            };
            const result={target,enClicked,viClicked,checks,
              ru:{htmlLang:ru.htmlLang,cyrillicChars:ru.cyrillicChars,latinChars:ru.latinChars,runtime:ru.runtime,typography:ru.typography,core:ru.core},
              en:{htmlLang:en.htmlLang,cyrillicChars:en.cyrillicChars,latinChars:en.latinChars,changedLeafTextsVsRu:changed(ru,en),typography:en.typography,core:en.core},
              vi:{htmlLang:vi.htmlLang,cyrillicChars:vi.cyrillicChars,latinChars:vi.latinChars,changedLeafTextsVsRu:changed(ru,vi),typography:vi.typography,core:vi.core}
            };
            fs.writeFileSync('live-diagnostics-v3.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            const failed=Object.entries(checks).filter(([,v])=>!v);
            await browser.close();
            if(failed.length){console.error('FAILED CHECKS',failed);process.exitCode=1;}
          })().catch(e=>{fs.writeFileSync('live-diagnostics-v3-error.txt',String(e&&e.stack||e));console.error(e);process.exitCode=1});
          JS
          node diagnose-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-diagnostics-v3
          path: |
            live-diagnostics-v3.json
            live-diagnostics-v3-error.txt
            mobile-ru.png
            mobile-en.png
            mobile-vi.png
          if-no-files-found: warn
