name: Reorder Telegram block

on:
  push:
    branches: [dashboard]
    paths: ['.reorder-telegram-block']

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dashboard
      - name: Move Telegram users block to top
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/client/main.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.index('    <section className="panel telegram-panel">')
          next_block = s.index('    <section className="grid two">\n      <article className="panel"><PanelTitle kicker="IP-АДРЕСА"', start)
          block = s[start:next_block]
          s = s[:start] + s[next_block:]
          metrics = s.index('    <section className="metrics six">')
          insert_at = s.index('    </section>', metrics) + len('    </section>')
          s = s[:insert_at] + '\n\n' + block.rstrip() + s[insert_at:]
          p.write_text(s, encoding='utf-8')
      - name: Verify order
        shell: bash
        run: |
          set -euo pipefail
          telegram=$(grep -n 'title="Telegram-пользователи"' src/client/main.tsx | head -1 | cut -d: -f1)
          dynamics=$(grep -n 'title="Посещения по дням"' src/client/main.tsx | head -1 | cut -d: -f1)
          projects=$(grep -n 'title="Какие прототипы открывают"' src/client/main.tsx | head -1 | cut -d: -f1)
          test "$telegram" -lt "$dynamics"
          test "$telegram" -lt "$projects"
      - name: Commit reorder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/main.tsx
          git commit -m 'ui: move Telegram users to top of analytics dashboard'
          git push origin HEAD:dashboard
