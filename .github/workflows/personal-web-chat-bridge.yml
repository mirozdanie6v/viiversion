name: Personal Web — ChatGPT GitHub bridge (public reads)

on:
  push:
    branches: [feat/personal-web-firecrawl-mvp]
    paths:
      - "personal-web/chat-bridge/request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-web-chat-bridge
  cancel-in-progress: false

jobs:
  browser-read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PERSONAL_WEB_API_TOKEN: ${{ secrets.PERSONAL_WEB_API_TOKEN }}
    steps:
      - name: Fetch the exact request revision
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser bridge JavaScript syntax
        run: node --check personal-web/chat-bridge/runner.mjs
      - name: Read a public website with VIIVERSION Personal Web
        run: node personal-web/chat-bridge/runner.mjs
